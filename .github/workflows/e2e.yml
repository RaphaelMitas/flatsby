name: E2E Tests

on:
  pull_request:

env:
  FORCE_COLOR: 3
  # Stream task logs live; the GHA default ("grouped") buffers all output until
  # a task finishes, which looks like a hang and loses logs on job timeout.
  TURBO_LOG_ORDER: stream
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# A run costs five macOS runners and five emulators, so it stays off fork PRs
# as it did before: the entry jobs are gated on the PR coming from this repo,
# and the shards inherit that through `needs`.
jobs:
  e2e-web:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Install Playwright Chromium
        run: pnpm --filter @flatsby/nextjs exec playwright install --with-deps chromium

      - name: Start E2E stack
        uses: ./tooling/github/e2e-stack

      - name: Run Playwright tests
        run: pnpm turbo run test:e2e --filter=@flatsby/nextjs
        env:
          BASE_URL: http://localhost:3000

      - name: Dump stack logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/web.log "$RUNNER_TEMP"/wsproxy.log

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/nextjs/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/nextjs/test-results/
          retention-days: 7

  e2e-ios-build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Validate Maestro flows
        working-directory: apps/expo
        run: node e2e/validate-flows.mjs

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Native build cache key
        id: native
        run: |
          key=$(bash apps/expo/e2e/native-key.sh ios)
          echo "name=$key" >> "$GITHUB_OUTPUT"

      - name: Restore native build
        id: cached
        uses: ./tooling/github/restore-artifact
        with:
          name: ${{ steps.native.outputs.name }}
          dir: ${{ runner.temp }}/native

      - name: Repack cached build with this JS
        id: repack
        if: steps.cached.outputs.hit == 'true'
        continue-on-error: true
        run: apps/expo/e2e/repack.sh ios "$RUNNER_TEMP/native/Flatsby.app"

      # CCACHE_BINARY has to be a real env var: React Native's ccache-clang.sh
      # execs it, and the build setting CocoaPods writes never reaches it.
      - name: Setup ccache
        if: steps.repack.outcome != 'success'
        run: |
          brew install ccache
          {
            echo "CCACHE_BINARY=$(command -v ccache)"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=3G"
          } >> "$GITHUB_ENV"

      - name: Restore ccache
        if: steps.repack.outcome != 'success'
        uses: ./tooling/github/restore-artifact
        with:
          name: ccache-macos
          dir: "~"

      - name: Build app for simulator
        if: steps.repack.outcome != 'success'
        run: |
          ccache --zero-stats > /dev/null
          bash apps/expo/e2e/build-native.sh ios "$RUNNER_TEMP/native"
          ccache --show-stats
          tar -C "$HOME" -czf "$GITHUB_WORKSPACE/ccache.tar.gz" .ccache

      - name: Upload ccache artifact
        if: steps.repack.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ccache-macos
          path: ccache.tar.gz
          # Only native-cache misses refresh it, so it has to outlive a run of JS-only PRs.
          retention-days: 14

      # tar keeps the executable bits that upload-artifact's zip would strip.
      - name: Pack app
        run: tar -C "$RUNNER_TEMP/native" -czf Flatsby-app.tar.gz Flatsby.app

      - name: Upload native build for later runs
        if: steps.repack.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.native.outputs.name }}
          path: Flatsby-app.tar.gz
          retention-days: 14

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-app
          path: Flatsby-app.tar.gz
          retention-days: 1

  e2e-ios:
    needs: e2e-ios-build
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Five shards: the repo's macOS runner concurrency is 5, so a sixth would
      # queue behind the first finisher. Nothing runs a flow no shard names.
      matrix:
        include:
          - shard: quick
            areas: smoke auth home account calendar
          - shard: group
            areas: group
          - shard: sl-browse
            areas: shopping-list/dashboard shopping-list/filtering shopping-list/items
          - shard: sl-manage
            areas: shopping-list/management shopping-list/suggestions expenses/splits
          - shard: expenses
            areas: expenses/creation expenses/debts-settle expenses/debts expenses/management
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Install Maestro
        run: bash apps/expo/e2e/install-maestro.sh "$RUNNER_TEMP/maestro" >> "$GITHUB_PATH"

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-e2e-app

      - name: Unpack app
        run: tar -xzf Flatsby-app.tar.gz

      # Before the simulator exists: its first boot takes the runner's three
      # cores for minutes and starves anything started next to it.
      - name: Start E2E stack
        uses: ./tooling/github/e2e-stack

      # Pro Max because old models time out Maestro's driver and the flows' tab
      # positions assume its screen.
      - name: Create iOS simulator
        id: sim
        uses: ./tooling/github/ios-simulator
        with:
          device: "^iPhone [0-9]+ Pro Max$"

      - name: Install and pre-warm app
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: bash apps/expo/e2e/prepare-device.sh ios "$UDID" Flatsby.app

      # A fresh simulator keeps working for minutes after bootstatus returns,
      # and flows started into that time out on their first waits.
      - name: Wait for the simulator to settle
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # apsd never settles on a VM, and the app registers for no remote pushes.
          xcrun simctl spawn "$UDID" launchctl bootout user/foreground/com.apple.apsd || true
          quiet=0
          while [ "$quiet" -lt 4 ] && [ "$SECONDS" -lt 420 ]; do
            # top's first sample is the average since boot; the second covers the 5s.
            idle=$(top -l 2 -n 0 -s 5 | awk '/^CPU usage/ { idle = $7 } END { print int(idle) }')
            echo "CPU idle: $idle%"
            if [ "$idle" -ge 50 ]; then quiet=$((quiet + 1)); else quiet=0; fi
          done
          [ "$quiet" -ge 4 ] || echo "Flows started on a busy simulator after ${SECONDS}s"

      # The simulator shares the host's network stack, so localhost is the
      # runner's own server.
      - name: Run Maestro tests
        working-directory: apps/expo
        run: node e2e/run-flows.mjs ${{ matrix.areas }}
        env:
          E2E_API_URL: http://localhost:3000
          E2E_DEVICE: ${{ steps.sim.outputs.udid }}

      - name: Collect crash reports, simulator and server logs
        if: always()
        working-directory: apps/expo
        run: |
          mkdir -p e2e/results/diagnostics
          cp -f ~/Library/Logs/DiagnosticReports/*.crash e2e/results/diagnostics/ 2>/dev/null || true
          cp -f ~/Library/Logs/DiagnosticReports/*.ips e2e/results/diagnostics/ 2>/dev/null || true
          cp -f "$RUNNER_TEMP"/web.log "$RUNNER_TEMP"/wsproxy.log e2e/results/diagnostics/ 2>/dev/null || true
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --style compact --last 30m \
            --predicate 'processImagePath CONTAINS "Flatsby" OR senderImagePath CONTAINS "Flatsby"' \
            > e2e/results/diagnostics/sim-log.txt 2>/dev/null || true

      # Maestro's failure debug bundle sits under a hidden .maestro/ dir,
      # which upload-artifact drops by default. An artifact service timeout
      # must not fail a shard whose flows passed.
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-${{ matrix.shard }}
          path: apps/expo/e2e/results/
          include-hidden-files: true
          retention-days: 7

  e2e-android-build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Native build cache key
        id: native
        run: |
          key=$(bash apps/expo/e2e/native-key.sh android)
          echo "name=$key" >> "$GITHUB_OUTPUT"

      - name: Restore native build
        id: cached
        uses: ./tooling/github/restore-artifact
        with:
          name: ${{ steps.native.outputs.name }}
          dir: ${{ runner.temp }}/native

      - name: Repack cached build with this JS
        id: repack
        if: steps.cached.outputs.hit == 'true'
        continue-on-error: true
        run: apps/expo/e2e/repack.sh android "$RUNNER_TEMP/native/app-release.apk" "$RUNNER_TEMP/native/bundle-res"

      - name: Install NDK
        if: steps.repack.outcome != 'success'
        uses: ./tooling/github/android-sdk
        with:
          ndk: "true"

      # x86_64: that's what the CI emulator runs.
      - name: Build APK for emulator
        if: steps.repack.outcome != 'success'
        run: |
          bash apps/expo/e2e/build-native.sh android "$RUNNER_TEMP/native" x86_64
          tar -C "$RUNNER_TEMP/native" -czf "$GITHUB_WORKSPACE/android-native.tar.gz" app-release.apk bundle-res

      - name: Upload native build for later runs
        if: steps.repack.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.native.outputs.name }}
          path: android-native.tar.gz
          retention-days: 14

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-app
          path: ${{ runner.temp }}/native/app-release.apk
          retention-days: 1

  e2e-android:
    needs: e2e-android-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Same shards as e2e-ios so a red shard points at the same area on both
      # platforms.
      matrix:
        include:
          - shard: quick
            areas: smoke auth home account calendar
          - shard: group
            areas: group
          - shard: sl-browse
            areas: shopping-list/dashboard shopping-list/filtering shopping-list/items
          - shard: sl-manage
            areas: shopping-list/management shopping-list/suggestions shopping-list/offline expenses/splits
          - shard: expenses
            areas: expenses/creation expenses/debts-settle expenses/debts expenses/management
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Hosted Linux runners expose /dev/kvm but gate it behind root; without
      # this the emulator falls back to software virtualization and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: bash apps/expo/e2e/install-maestro.sh "$RUNNER_TEMP/maestro" >> "$GITHUB_PATH"

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: android-e2e-app

      - name: Start E2E stack
        uses: ./tooling/github/e2e-stack

      - name: Install emulator and system image
        uses: ./tooling/github/android-sdk
        with:
          packages: emulator system-images;android-34;google_apis;x86_64

      # The runner executes every `script` line as a separate `sh -c`, so the
      # install / pre-warm / run / logcat sequence lives in one script file.
      - name: Run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          # Default is 2 of the runner's 4 vCPUs; the software-rendered
          # emulator ANRs the launcher under load with only 2.
          cores: 3
          # -dns-server: the hosted runner resolves via systemd-resolved on
          # 127.0.0.53, which the emulator guest can't reach — DNS lookups in
          # the app then hang instead of resolving.
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -dns-server 8.8.8.8
          disable-animations: true
          script: bash apps/expo/e2e/android-ci.sh "$GITHUB_WORKSPACE/app-release.apk" ${{ matrix.areas }}
        env:
          E2E_PLATFORM: android
          E2E_API_URL: http://localhost:3000

      - name: Collect stack logs
        if: always()
        run: |
          mkdir -p apps/expo/e2e/results/diagnostics
          cp -f "$RUNNER_TEMP"/web.log "$RUNNER_TEMP"/wsproxy.log apps/expo/e2e/results/diagnostics/ || true

      # Maestro's failure debug bundle sits under a hidden .maestro/ dir,
      # which upload-artifact drops by default. An artifact service timeout
      # must not fail a shard whose flows passed.
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-results-${{ matrix.shard }}
          path: apps/expo/e2e/results/
          include-hidden-files: true
          retention-days: 7
