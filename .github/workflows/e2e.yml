name: E2E Tests

on:
  pull_request:

env:
  FORCE_COLOR: 3
  # Stream task logs live; the GHA default ("grouped") buffers all output until
  # a task finishes, which looks like a hang and loses logs on job timeout.
  TURBO_LOG_ORDER: stream
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# A run costs five macOS runners and five emulators, so it stays off fork PRs
# as it did before: the entry jobs are gated on the PR coming from this repo,
# and the shards inherit that through `needs`.
jobs:
  e2e-web:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Install Playwright Chromium
        run: pnpm --filter @flatsby/nextjs exec playwright install --with-deps chromium

      - name: Start E2E stack
        uses: ./tooling/github/e2e-stack

      - name: Run Playwright tests
        run: pnpm turbo run test:e2e --filter=@flatsby/nextjs
        env:
          BASE_URL: http://localhost:3000

      - name: Dump stack logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/web.log "$RUNNER_TEMP"/wsproxy.log

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/nextjs/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/nextjs/test-results/
          retention-days: 7

  e2e-ios-build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Validate Maestro flows
        working-directory: apps/expo
        run: node e2e/validate-flows.mjs

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      # CCACHE_BINARY has to be a real env var: React Native's ccache-clang.sh
      # execs it, and the build setting CocoaPods writes never reaches it.
      - name: Setup ccache
        run: |
          brew install ccache
          {
            echo "CCACHE_BINARY=$(command -v ccache)"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=3G"
          } >> "$GITHUB_ENV"

      # actions/cache scopes entries to the branch that wrote them, so PRs
      # would never share a pool and release.yml on main could not read one;
      # artifacts are visible repo-wide, so the pool travels as one.
      - name: Restore ccache from artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=ccache-macos&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -z "$ART_ID" ]; then
            echo "No ccache artifact available; building cold"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > /tmp/ccache.zip \
            && unzip -q -o /tmp/ccache.zip -d /tmp/ccache-artifact \
            && tar -xzf /tmp/ccache-artifact/ccache.tar.gz -C "$HOME" \
            && echo "Restored ccache from artifact $ART_ID" \
            || echo "ccache artifact $ART_ID unusable; building cold"

      - name: Prebuild iOS project
        working-directory: apps/expo
        run: pnpm expo prebuild --platform ios --no-install
        env:
          E2E_TESTING: "true"

      - name: Install CocoaPods dependencies
        working-directory: apps/expo/ios
        run: pod install
        env:
          LANG: en_US.UTF-8

      # E2E_TESTING again: the expo-constants build phase re-evaluates
      # app.config.ts during xcodebuild. CODE_SIGNING_ALLOWED=NO would be the
      # obvious flag but strips keychain entitlements, crashing secure-store.
      - name: Build app for simulator
        working-directory: apps/expo/ios
        run: |
          set -o pipefail
          ccache --zero-stats > /dev/null
          xcodebuild -workspace Flatsby.xcworkspace -scheme Flatsby \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGN_IDENTITY=- \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build | xcbeautify
          ccache --show-stats
        env:
          E2E_TESTING: "true"

      - name: Pack ccache for next run
        run: tar -C "$HOME" -czf ccache.tar.gz .ccache

      - name: Upload ccache artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccache-macos
          path: ccache.tar.gz
          retention-days: 3

      # tar keeps the executable bits that upload-artifact's zip would strip.
      - name: Pack app for test shards
        run: tar -C apps/expo/ios/build/Build/Products/Release-iphonesimulator -czf Flatsby-app.tar.gz Flatsby.app

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-app
          path: Flatsby-app.tar.gz
          retention-days: 1

  e2e-ios:
    needs: e2e-ios-build
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Five shards of ~10-13 min: the repo's macOS runner concurrency is 5,
      # so a sixth would queue behind the first finisher.
      matrix:
        include:
          - shard: quick
            areas: smoke auth home account
          - shard: group
            areas: group
          - shard: sl-browse
            areas: shopping-list/dashboard shopping-list/filtering shopping-list/items
          - shard: sl-manage
            areas: shopping-list/management shopping-list/suggestions
          - shard: expenses
            areas: expenses
    env:
      MAESTRO_VERSION: "2.3.0"
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-e2e-app

      - name: Unpack app
        run: tar -xzf Flatsby-app.tar.gz

      # Highest iPhone model number: the images still carry old devices, and
      # an iPhone 11 boots slowly enough to time out Maestro's driver.
      - name: Boot iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS")) | .value[]
              | select(.name | startswith("iPhone"))
              | {udid, n: ([.name | scan("[0-9]+") | tonumber] | first // 0)}]
            | sort_by(.n) | last // {} | .udid // empty')
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator available on this image"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility ReduceMotionEnabled 1
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # The first launch pays dyld/springboard warm-up, which stalls past the
      # first flow's wait if it happens inside Maestro.
      - name: Install and pre-warm app
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl install "$UDID" Flatsby.app
          xcrun simctl launch "$UDID" com.flatcove.app.v2 || true
          sleep 15
          xcrun simctl terminate "$UDID" com.flatcove.app.v2 || true

      - name: Start E2E stack
        uses: ./tooling/github/e2e-stack

      # The simulator shares the host's network stack, so localhost is the
      # runner's own server.
      - name: Run Maestro tests
        working-directory: apps/expo
        run: node e2e/run-flows.mjs ${{ matrix.areas }}
        env:
          E2E_API_URL: http://localhost:3000

      - name: Collect crash reports, simulator and server logs
        if: always()
        working-directory: apps/expo
        run: |
          mkdir -p e2e/results/diagnostics
          cp -f ~/Library/Logs/DiagnosticReports/*.crash e2e/results/diagnostics/ 2>/dev/null || true
          cp -f ~/Library/Logs/DiagnosticReports/*.ips e2e/results/diagnostics/ 2>/dev/null || true
          cp -f "$RUNNER_TEMP"/web.log "$RUNNER_TEMP"/wsproxy.log e2e/results/diagnostics/ 2>/dev/null || true
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --style compact --last 30m \
            --predicate 'processImagePath CONTAINS "Flatsby" OR senderImagePath CONTAINS "Flatsby"' \
            > e2e/results/diagnostics/sim-log.txt 2>/dev/null || true

      # Maestro's failure debug bundle sits under a hidden .maestro/ dir,
      # which upload-artifact drops by default.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-${{ matrix.shard }}
          path: apps/expo/e2e/results/
          include-hidden-files: true
          retention-days: 7

  e2e-android-build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Artifact pool rather than actions/cache, same as the iOS ccache.
      - name: Restore Gradle cache from artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=gradle-android&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -z "$ART_ID" ]; then
            echo "No Gradle cache artifact available; building cold"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > /tmp/gradle.zip \
            && unzip -q -o /tmp/gradle.zip -d /tmp/gradle-artifact \
            && tar -xzf /tmp/gradle-artifact/gradle-cache.tar.gz -C "$HOME" \
            && echo "Restored Gradle cache from artifact $ART_ID" \
            || echo "Gradle cache artifact $ART_ID unusable; building cold"

      - name: Prebuild Android project
        working-directory: apps/expo
        run: pnpm expo prebuild --platform android --no-install
        env:
          E2E_TESTING: "true"

      # The template's 512m Metaspace cap OOMs the daemon mid-build; a later
      # duplicate key in gradle.properties wins, so appending overrides it.
      - name: Raise Gradle memory limits
        working-directory: apps/expo/android
        run: printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties

      # E2E_TESTING again: the expo-constants Gradle task re-evaluates
      # app.config.ts during the build. x86_64 only — that's what the CI
      # emulator runs, and skipping the other ABIs halves native compile time.
      # Release builds sign with the debug keystore in the Expo template, so
      # the APK installs on the emulator as-is. lintVital is excluded: release
      # lint adds nothing to a throwaway e2e APK and is the heaviest Metaspace
      # consumer.
      - name: Build APK for emulator
        working-directory: apps/expo/android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon \
            -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease
        env:
          E2E_TESTING: "true"

      - name: Pack Gradle cache for next run
        run: tar -C "$HOME" -czf gradle-cache.tar.gz .gradle/caches .gradle/wrapper

      - name: Upload Gradle cache artifact
        uses: actions/upload-artifact@v7
        with:
          name: gradle-android
          path: gradle-cache.tar.gz
          retention-days: 3

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-app
          path: apps/expo/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  e2e-android:
    needs: e2e-android-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Same shards as e2e-ios so a red shard points at the same area on both
      # platforms.
      matrix:
        include:
          - shard: quick
            areas: smoke auth home account
          - shard: group
            areas: group
          - shard: sl-browse
            areas: shopping-list/dashboard shopping-list/filtering shopping-list/items
          - shard: sl-manage
            areas: shopping-list/management shopping-list/suggestions
          - shard: expenses
            areas: expenses
    env:
      MAESTRO_VERSION: "2.3.0"
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Hosted Linux runners expose /dev/kvm but gate it behind root; without
      # this the emulator falls back to software virtualization and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: android-e2e-app

      - name: Start E2E stack
        uses: ./tooling/github/e2e-stack

      # The runner executes every `script` line as a separate `sh -c`, so the
      # install / pre-warm / run / logcat sequence lives in one script file.
      - name: Run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          # Default is 2 of the runner's 4 vCPUs; the software-rendered
          # emulator ANRs the launcher under load with only 2.
          cores: 3
          # -dns-server: the hosted runner resolves via systemd-resolved on
          # 127.0.0.53, which the emulator guest can't reach — DNS lookups in
          # the app then hang instead of resolving.
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -dns-server 8.8.8.8
          disable-animations: true
          script: bash apps/expo/e2e/android-ci.sh "$GITHUB_WORKSPACE/app-release.apk" ${{ matrix.areas }}
        env:
          E2E_PLATFORM: android
          E2E_API_URL: http://localhost:3000

      - name: Collect stack logs
        if: always()
        run: |
          mkdir -p apps/expo/e2e/results/diagnostics
          cp -f "$RUNNER_TEMP"/web.log "$RUNNER_TEMP"/wsproxy.log apps/expo/e2e/results/diagnostics/ || true

      # Maestro's failure debug bundle sits under a hidden .maestro/ dir,
      # which upload-artifact drops by default.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-results-${{ matrix.shard }}
          path: apps/expo/e2e/results/
          include-hidden-files: true
          retention-days: 7
