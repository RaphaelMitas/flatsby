name: E2E Tests

on:
  deployment_status:

env:
  FORCE_COLOR: 3
  # Stream task logs live; the GHA default ("grouped") buffers all output until
  # a task finishes, which looks like a hang and loses logs on job timeout.
  TURBO_LOG_ORDER: stream
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  check-pr:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    outputs:
      has-pr: ${{ steps.check.outputs.has-pr }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - name: Check for associated PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # deployment_status runs carry secrets; never gate on fork PRs.
          PR_JSON=$(gh pr list --repo "${{ github.repository }}" --search "${{ github.event.deployment.sha }}" --state open --json number,headRefName,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0]')
          if [[ -n "$PR_JSON" && "$PR_JSON" != "null" ]]; then
            echo "has-pr=true" >> "$GITHUB_OUTPUT"
            echo "branch=$(echo "$PR_JSON" | jq -r '.headRefName')" >> "$GITHUB_OUTPUT"
          else
            echo "has-pr=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-web:
    needs: check-pr
    if: needs.check-pr.outputs.has-pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: e2e-web-${{ needs.check-pr.outputs.branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Install Playwright Chromium
        run: pnpm --filter @flatsby/nextjs exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm turbo run test:e2e --filter=@flatsby/nextjs
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/nextjs/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/nextjs/test-results/
          retention-days: 7

  e2e-ios-build:
    needs: check-pr
    if: needs.check-pr.outputs.has-pr == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: e2e-ios-build-${{ needs.check-pr.outputs.branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Validate Maestro flows
        working-directory: apps/expo
        run: node e2e/validate-flows.mjs

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      # CCACHE_BINARY has to be a real env var: React Native's ccache-clang.sh
      # execs it, and the build setting CocoaPods writes never reaches it.
      - name: Setup ccache
        run: |
          brew install ccache
          {
            echo "CCACHE_BINARY=$(command -v ccache)"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=3G"
          } >> "$GITHUB_ENV"

      # actions/cache rejects deployment_status runs ("not tied to a branch or
      # tag ref"); artifacts work, so the pool travels as one.
      - name: Restore ccache from artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=ccache-macos&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -z "$ART_ID" ]; then
            echo "No ccache artifact available; building cold"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > /tmp/ccache.zip \
            && unzip -q -o /tmp/ccache.zip -d /tmp/ccache-artifact \
            && tar -xzf /tmp/ccache-artifact/ccache.tar.gz -C "$HOME" \
            && echo "Restored ccache from artifact $ART_ID" \
            || echo "ccache artifact $ART_ID unusable; building cold"

      - name: Prebuild iOS project
        working-directory: apps/expo
        run: pnpm expo prebuild --platform ios --no-install
        env:
          E2E_TESTING: "true"

      - name: Install CocoaPods dependencies
        working-directory: apps/expo/ios
        run: pod install
        env:
          LANG: en_US.UTF-8

      # E2E_TESTING again: the expo-constants build phase re-evaluates
      # app.config.ts during xcodebuild. CODE_SIGNING_ALLOWED=NO would be the
      # obvious flag but strips keychain entitlements, crashing secure-store.
      - name: Build app for simulator
        working-directory: apps/expo/ios
        run: |
          set -o pipefail
          ccache --zero-stats > /dev/null
          xcodebuild -workspace Flatsby.xcworkspace -scheme Flatsby \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGN_IDENTITY=- \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build | xcbeautify
          ccache --show-stats
        env:
          E2E_TESTING: "true"

      - name: Pack ccache for next run
        run: tar -C "$HOME" -czf ccache.tar.gz .ccache

      - name: Upload ccache artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccache-macos
          path: ccache.tar.gz
          retention-days: 3

      # tar keeps the executable bits that upload-artifact's zip would strip.
      - name: Pack app for test shards
        run: tar -C apps/expo/ios/build/Build/Products/Release-iphonesimulator -czf Flatsby-app.tar.gz Flatsby.app

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-app
          path: Flatsby-app.tar.gz
          retention-days: 1

  e2e-ios:
    needs: [check-pr, e2e-ios-build]
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Five shards of ~10-13 min: the repo's macOS runner concurrency is 5,
      # so a sixth would queue behind the first finisher.
      matrix:
        include:
          - shard: quick
            areas: smoke auth home account
          - shard: group
            areas: group
          - shard: sl-browse
            areas: shopping-list/dashboard shopping-list/filtering shopping-list/items
          - shard: sl-manage
            areas: shopping-list/management shopping-list/suggestions
          - shard: expenses
            areas: expenses
    concurrency:
      group: e2e-ios-${{ needs.check-pr.outputs.branch }}-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      MAESTRO_VERSION: "2.3.0"
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-e2e-app

      - name: Unpack app
        run: tar -xzf Flatsby-app.tar.gz

      # Highest iPhone model number: the images still carry old devices, and
      # an iPhone 11 boots slowly enough to time out Maestro's driver.
      - name: Boot iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS")) | .value[]
              | select(.name | startswith("iPhone"))
              | {udid, n: ([.name | scan("[0-9]+") | tonumber] | first // 0)}]
            | sort_by(.n) | last // {} | .udid // empty')
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator available on this image"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility ReduceMotionEnabled 1
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # The first launch pays dyld/springboard warm-up, which stalls past the
      # first flow's wait if it happens inside Maestro.
      - name: Install and pre-warm app
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl install "$UDID" Flatsby.app
          xcrun simctl launch "$UDID" com.flatcove.app.v2 || true
          sleep 15
          xcrun simctl terminate "$UDID" com.flatcove.app.v2 || true

      - name: Run Maestro tests
        working-directory: apps/expo
        run: node e2e/run-flows.mjs ${{ matrix.areas }}
        env:
          E2E_API_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Collect crash reports & simulator logs
        if: always()
        working-directory: apps/expo
        run: |
          mkdir -p e2e/results/diagnostics
          cp -f ~/Library/Logs/DiagnosticReports/*.crash e2e/results/diagnostics/ 2>/dev/null || true
          cp -f ~/Library/Logs/DiagnosticReports/*.ips e2e/results/diagnostics/ 2>/dev/null || true
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --style compact --last 30m \
            --predicate 'processImagePath CONTAINS "Flatsby" OR senderImagePath CONTAINS "Flatsby"' \
            > e2e/results/diagnostics/sim-log.txt 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-${{ matrix.shard }}
          path: apps/expo/e2e/results/
          retention-days: 7

  e2e-android-build:
    needs: check-pr
    if: needs.check-pr.outputs.has-pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: e2e-android-build-${{ needs.check-pr.outputs.branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # actions/cache rejects deployment_status runs ("not tied to a branch or
      # tag ref"); artifacts work, same as the iOS ccache pool.
      - name: Restore Gradle cache from artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=gradle-android&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -z "$ART_ID" ]; then
            echo "No Gradle cache artifact available; building cold"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > /tmp/gradle.zip \
            && unzip -q -o /tmp/gradle.zip -d /tmp/gradle-artifact \
            && tar -xzf /tmp/gradle-artifact/gradle-cache.tar.gz -C "$HOME" \
            && echo "Restored Gradle cache from artifact $ART_ID" \
            || echo "Gradle cache artifact $ART_ID unusable; building cold"

      - name: Prebuild Android project
        working-directory: apps/expo
        run: pnpm expo prebuild --platform android --no-install
        env:
          E2E_TESTING: "true"

      # E2E_TESTING again: the expo-constants Gradle task re-evaluates
      # app.config.ts during the build. x86_64 only — that's what the CI
      # emulator runs, and skipping the other ABIs halves native compile time.
      # Release builds sign with the debug keystore in the Expo template, so
      # the APK installs on the emulator as-is.
      - name: Build APK for emulator
        working-directory: apps/expo/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        env:
          E2E_TESTING: "true"

      - name: Pack Gradle cache for next run
        run: tar -C "$HOME" -czf gradle-cache.tar.gz .gradle/caches .gradle/wrapper

      - name: Upload Gradle cache artifact
        uses: actions/upload-artifact@v7
        with:
          name: gradle-android
          path: gradle-cache.tar.gz
          retention-days: 3

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-app
          path: apps/expo/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  e2e-android:
    needs: [check-pr, e2e-android-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Same shards as e2e-ios so a red shard points at the same area on both
      # platforms.
      matrix:
        include:
          - shard: quick
            areas: smoke auth home account
          - shard: group
            areas: group
          - shard: sl-browse
            areas: shopping-list/dashboard shopping-list/filtering shopping-list/items
          - shard: sl-manage
            areas: shopping-list/management shopping-list/suggestions
          - shard: expenses
            areas: expenses
    concurrency:
      group: e2e-android-${{ needs.check-pr.outputs.branch }}-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      MAESTRO_VERSION: "2.3.0"
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Hosted Linux runners expose /dev/kvm but gate it behind root; without
      # this the emulator falls back to software virtualization and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: android-e2e-app

      # Same pre-warm as iOS: the first launch pays JIT/dex warm-up, which
      # stalls past the first flow's wait if it happens inside Maestro.
      # logcat is dumped before the emulator dies with the step, pass or fail.
      - name: Run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install "$GITHUB_WORKSPACE/app-release.apk"
            adb shell monkey -p com.flatcove.app -c android.intent.category.LAUNCHER 1 || true
            sleep 15
            adb shell am force-stop com.flatcove.app || true
            cd apps/expo
            set +e
            node e2e/run-flows.mjs ${{ matrix.areas }}
            status=$?
            mkdir -p e2e/results/diagnostics
            adb logcat -d > e2e/results/diagnostics/logcat.txt || true
            exit $status
        env:
          E2E_PLATFORM: android
          E2E_API_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-results-${{ matrix.shard }}
          path: apps/expo/e2e/results/
          retention-days: 7
