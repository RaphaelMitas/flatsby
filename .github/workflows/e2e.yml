name: E2E Tests

on:
  deployment_status:

env:
  FORCE_COLOR: 3
  # Stream task logs live; the GHA default ("grouped") buffers all output until
  # a task finishes, which looks like a hang and loses logs on job timeout.
  TURBO_LOG_ORDER: stream
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  check-pr:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    outputs:
      has-pr: ${{ steps.check.outputs.has-pr }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - name: Check for associated PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # deployment_status runs carry secrets, so fork PRs (cross-repo
          # heads) must not gate downstream jobs on.
          PR_JSON=$(gh pr list --repo "${{ github.repository }}" --search "${{ github.event.deployment.sha }}" --state open --json number,headRefName,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0]')
          if [[ -n "$PR_JSON" && "$PR_JSON" != "null" ]]; then
            echo "has-pr=true" >> "$GITHUB_OUTPUT"
            echo "branch=$(echo "$PR_JSON" | jq -r '.headRefName')" >> "$GITHUB_OUTPUT"
          else
            echo "has-pr=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-web:
    needs: check-pr
    if: needs.check-pr.outputs.has-pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: e2e-web-${{ needs.check-pr.outputs.branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Install Playwright Chromium
        run: pnpm --filter @flatsby/nextjs exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm turbo run test:e2e --filter=@flatsby/nextjs
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/nextjs/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/nextjs/test-results/
          retention-days: 7

  # Build and test are separate jobs: a full suite run doesn't fit one 60-min
  # job on the 3-core runners (cold build ~27 min + ~40 min of flows), and a
  # timed-out job never saves its caches, so every retry rebuilt cold.
  e2e-ios-build:
    needs: check-pr
    if: needs.check-pr.outputs.has-pr == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: e2e-ios-build-${{ needs.check-pr.outputs.branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Validate Maestro flows
        working-directory: apps/expo
        run: node e2e/validate-flows.mjs

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      # DerivedData caching can't work here (prebuild regenerates the project
      # with fresh mtimes, forcing full rebuilds), so builds use ccache keyed
      # on file content instead — expo-build-properties wires it into the
      # Xcode project when E2E_TESTING=true.
      # CCACHE_BINARY must be a real env var: React Native's ccache-clang.sh
      # wrapper runs `exec $CCACHE_BINARY clang`, and the build setting
      # CocoaPods writes for it doesn't reach the compiler's environment — so
      # without this the wrapper silently execs plain clang and caches nothing.
      # The wrapper points CCACHE_CONFIGPATH at React Native's own tuned conf
      # (sloppiness, depend_mode), so size/location go through env vars.
      - name: Setup ccache
        run: |
          brew install ccache
          {
            echo "CCACHE_BINARY=$(command -v ccache)"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=3G"
          } >> "$GITHUB_ENV"

      # actions/cache cannot restore or save on deployment_status runs (the
      # cache service rejects the event: "not tied to a branch or tag ref"),
      # so the ccache pool travels as a workflow artifact instead — artifacts
      # work fine on these runs (the .app already ships between jobs as one).
      - name: Restore ccache from artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=ccache-macos&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$ART_ID" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > /tmp/ccache.zip
            unzip -q -o /tmp/ccache.zip -d /tmp/ccache-artifact
            tar -xzf /tmp/ccache-artifact/ccache.tar.gz -C "$HOME"
            echo "Restored ccache from artifact $ART_ID"
          else
            echo "No ccache artifact found; building cold"
          fi

      - name: Prebuild iOS project
        working-directory: apps/expo
        run: pnpm expo prebuild --platform ios --no-install
        env:
          E2E_TESTING: "true"

      - name: Install CocoaPods dependencies
        working-directory: apps/expo/ios
        run: pod install
        env:
          LANG: en_US.UTF-8

      # E2E_TESTING must be present here too: the expo-constants build phase
      # re-evaluates app.config.ts (extra.e2eTesting) during xcodebuild. It
      # also disables PostHog and RevenueCat in-app, so no EXPO_PUBLIC_* API
      # keys are needed for this build.
      # CODE_SIGN_IDENTITY=- instead of CODE_SIGNING_ALLOWED=NO: the latter
      # strips keychain entitlements and expo-secure-store crashes on launch.
      # ARCHS=arm64: the default Release simulator build produces universal
      # arm64+x86_64 binaries — double the compile work for a simulator that
      # only runs arm64.
      - name: Build app for simulator
        working-directory: apps/expo/ios
        run: |
          set -o pipefail
          ccache --zero-stats > /dev/null
          xcodebuild -workspace Flatsby.xcworkspace -scheme Flatsby \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGN_IDENTITY=- \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build | xcbeautify
          ccache --show-stats
        env:
          E2E_TESTING: "true"

      - name: Pack ccache for next run
        run: tar -C "$HOME" -czf ccache.tar.gz .ccache

      - name: Upload ccache artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccache-macos
          path: ccache.tar.gz
          retention-days: 3

      # tar keeps the executable bits that upload-artifact's zip would strip.
      - name: Pack app for test shards
        run: tar -C apps/expo/ios/build/Build/Products/Release-iphonesimulator -czf Flatsby-app.tar.gz Flatsby.app

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-app
          path: Flatsby-app.tar.gz
          retention-days: 1

  e2e-ios:
    needs: [check-pr, e2e-ios-build]
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Shards balanced on observed flow times (group flows 4-6 min,
      # shopping-list 4-7.5 min, expenses up to 15 min each on the 3-core
      # runners), leaving room for the failed-flow rerun inside the timeout.
      # macOS runner concurrency for the repo is 5, so one shard queues
      # briefly behind the first finisher.
      matrix:
        include:
          - shard: quick
            areas: smoke auth home account
          - shard: group
            areas: group
          - shard: sl-browse
            areas: shopping-list/dashboard shopping-list/filtering shopping-list/items
          - shard: sl-manage
            areas: shopping-list/management shopping-list/suggestions
          - shard: exp-create
            areas: expenses/creation expenses/management
          - shard: exp-splits
            areas: expenses/splits expenses/debts
    concurrency:
      group: e2e-ios-${{ needs.check-pr.outputs.branch }}-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      MAESTRO_VERSION: "2.3.0"
      MAESTRO_CLI_NO_ANALYTICS: "1"
      # The XCTest driver install/boot is slow on these shared runners; the
      # 3-core box blew the default startup timeout on a cold simulator.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
    steps:
      - uses: actions/checkout@v7

      # run-flows.mjs only needs Node (no workspace install).
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-e2e-app

      - name: Unpack app
        run: tar -xzf Flatsby-app.tar.gz

      - name: Boot iOS simulator
        id: sim
        run: |
          # Prefer a simulator the image already provisioned for its runtime,
          # picking the highest iPhone model number (an old device like the
          # iPhone 11 boots slowly enough to time out Maestro's driver).
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS")) | .value[]
              | select(.name | startswith("iPhone"))
              | {udid, name, n: ([.name | scan("[0-9]+") | tonumber] | first // 0)}]
            | sort_by(.n) | last // {} | .udid // empty')
          if [ -n "$UDID" ]; then
            echo "Reusing provisioned simulator: $(xcrun simctl list devices | grep "$UDID")"
            xcrun simctl erase "$UDID"
          else
            while read -r DEVICE_TYPE; do
              if UDID=$(xcrun simctl create "Flatsby-E2E" "$DEVICE_TYPE" 2>/dev/null); then
                echo "Created Flatsby-E2E ($DEVICE_TYPE): $UDID"
                break
              fi
            done < <(xcrun simctl list devicetypes --json | jq -r '
              [.devicetypes[] | select(.productFamily == "iPhone")
                | {identifier, n: ([.name | scan("[0-9]+") | tonumber] | first // 0)}]
              | sort_by(.n) | reverse | .[].identifier')
          fi
          if [ -z "$UDID" ]; then
            echo "::error::Could not select an iPhone simulator on this image"
            xcrun simctl list devices available
            xcrun simctl list devicetypes
            exit 1
          fi
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          # Reduce Motion: animation settle time is a flake source on shared runners
          xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility ReduceMotionEnabled 1
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Install app on simulator
        run: xcrun simctl install "${{ steps.sim.outputs.udid }}" Flatsby.app

      # The very first launch after install pays dyld/springboard warm-up and
      # regularly stalls past the flow's wait inside Maestro; take that hit
      # here instead, outside any flow timing.
      - name: Pre-warm app
        run: |
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" com.flatcove.app.v2 || true
          sleep 15
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" com.flatcove.app.v2 || true

      - name: Start screen recording
        working-directory: apps/expo
        run: |
          mkdir -p e2e/results
          nohup xcrun simctl io "${{ steps.sim.outputs.udid }}" recordVideo --codec h264 --force e2e/results/recording.mp4 > e2e/results/recording.log 2>&1 &
          echo $! > "$RUNNER_TEMP/recording.pid"

      - name: Run Maestro tests
        working-directory: apps/expo
        run: node e2e/run-flows.mjs ${{ matrix.areas }}
        env:
          E2E_API_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Stop screen recording
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/recording.pid" ]; then
            kill -INT "$(cat "$RUNNER_TEMP/recording.pid")" 2>/dev/null || true
            sleep 5
          fi

      - name: Collect crash reports & simulator logs
        if: always()
        working-directory: apps/expo
        run: |
          mkdir -p e2e/results/diagnostics
          cp -f ~/Library/Logs/DiagnosticReports/*.crash e2e/results/diagnostics/ 2>/dev/null || true
          cp -f ~/Library/Logs/DiagnosticReports/*.ips e2e/results/diagnostics/ 2>/dev/null || true
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --style compact --last 30m \
            --predicate 'processImagePath CONTAINS "Flatsby" OR senderImagePath CONTAINS "Flatsby"' \
            > e2e/results/diagnostics/sim-log.txt 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-${{ matrix.shard }}
          path: apps/expo/e2e/results/
          retention-days: 7
