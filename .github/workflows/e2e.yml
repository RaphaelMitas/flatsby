name: E2E Tests

on:
  deployment_status:

env:
  FORCE_COLOR: 3
  # Stream task logs live; the GHA default ("grouped") buffers all output until
  # a task finishes, which looks like a hang and loses logs on job timeout.
  TURBO_LOG_ORDER: stream
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  check-pr:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    outputs:
      has-pr: ${{ steps.check.outputs.has-pr }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - name: Check for associated PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr list --repo "${{ github.repository }}" --search "${{ github.event.deployment.sha }}" --state open --json number,headRefName --jq '.[0]')
          if [[ -n "$PR_JSON" && "$PR_JSON" != "null" ]]; then
            echo "has-pr=true" >> "$GITHUB_OUTPUT"
            echo "branch=$(echo "$PR_JSON" | jq -r '.headRefName')" >> "$GITHUB_OUTPUT"
          else
            echo "has-pr=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-web:
    needs: check-pr
    if: needs.check-pr.outputs.has-pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: e2e-web-${{ needs.check-pr.outputs.branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Install Playwright Chromium
        run: pnpm --filter @flatsby/nextjs exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm turbo run test:e2e --filter=@flatsby/nextjs
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/nextjs/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/nextjs/test-results/
          retention-days: 7

  e2e-ios:
    needs: check-pr
    if: needs.check-pr.outputs.has-pr == 'true'
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 45
    concurrency:
      group: e2e-ios-${{ needs.check-pr.outputs.branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup
        with:
          cache: "false"

      - name: Clean native build artifacts
        working-directory: apps/expo
        run: pnpm clean:e2e && rm -rf "$RUNNER_TEMP/eas-build"

      - name: Update CocoaPods repo
        run: pod repo update

      - name: Build app for simulator
        working-directory: apps/expo
        run: pnpm build:e2e
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-build
          EXPO_PUBLIC_API_BASE_URL: ${{ github.event.deployment_status.target_url }}

      - name: Boot iOS Simulator
        working-directory: apps/expo
        run: pnpm e2e:sim:boot

      - name: Install app on simulator
        working-directory: apps/expo
        run: pnpm e2e:sim:install

      - name: Run Maestro tests
        working-directory: apps/expo
        run: pnpm test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results
          path: apps/expo/e2e/results/
          retention-days: 7

      - name: Shutdown simulator
        if: always()
        working-directory: apps/expo
        run: pnpm e2e:sim:shutdown
