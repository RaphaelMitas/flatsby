# Temporary pre-merge test rig: runs the release workflow's screenshots-ios
# job (iPhone + iPad captures) against the branch's preview deployment,
# without touching tags, releases, or store listings. Delete before merging.
name: Test store screenshots
on:
  push:
    branches: [claude/release-pipeline-logs-ig26ju]
permissions:
  contents: read
  actions: read
  deployments: read

env:
  FORCE_COLOR: 3

jobs:
  screenshots-ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Resolve screenshot API URL
        id: shots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE: ${{ vars.E2E_SCREENSHOT_API_URL }}
        run: |
          URL="$OVERRIDE"
          if [ -z "$URL" ]; then
            for id in $(gh api "repos/${{ github.repository }}/deployments?environment=Preview&per_page=30" --jq '.[].id'); do
              URL=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" \
                --jq '[.[] | select(.state == "success")][0] | (.environment_url // .target_url) // empty')
              [ -n "$URL" ] && break
            done
          fi
          if [ -z "$URL" ]; then
            echo "::error::No successful preview deployment found"
            exit 1
          fi
          echo "Screenshot API: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Setup ccache
        run: |
          brew install ccache
          {
            echo "CCACHE_BINARY=$(command -v ccache)"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=3G"
          } >> "$GITHUB_ENV"

      - name: Restore ccache from artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=ccache-macos&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
          if [ -z "$ART_ID" ]; then
            echo "No ccache artifact available; building cold"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > /tmp/ccache.zip \
            && unzip -q -o /tmp/ccache.zip -d /tmp/ccache-artifact \
            && tar -xzf /tmp/ccache-artifact/ccache.tar.gz -C "$HOME" \
            && echo "Restored ccache from artifact $ART_ID" \
            || echo "ccache artifact $ART_ID unusable; building cold"

      - name: Prebuild iOS project
        working-directory: apps/expo
        run: pnpm expo prebuild --platform ios --no-install
        env:
          E2E_TESTING: "true"

      - name: Install CocoaPods dependencies
        working-directory: apps/expo/ios
        run: pod install
        env:
          LANG: en_US.UTF-8

      - name: Build app for simulator
        working-directory: apps/expo/ios
        run: |
          set -o pipefail
          ccache --zero-stats > /dev/null
          xcodebuild -workspace Flatsby.xcworkspace -scheme Flatsby \
            -configuration Release -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGN_IDENTITY=- \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build | xcbeautify
          ccache --show-stats
        env:
          E2E_TESTING: "true"

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS simulator
        id: sim
        run: |
          pick() {
            xcrun simctl list devices available --json | jq -r --arg re "$1" '
              [.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                | select(.name | test($re))
                | {udid, n: ([.name | scan("[0-9]+") | tonumber] | first // 0)}]
              | sort_by(.n) | last // {} | .udid // empty'
          }
          UDID=$(pick "^iPhone.*Pro Max")
          [ -z "$UDID" ] && UDID=$(pick "^iPhone")
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator available on this image"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility ReduceMotionEnabled 1
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Clean up status bar and set dark mode for screenshots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100

      - name: Install and pre-warm app
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl install "$UDID" apps/expo/ios/build/Build/Products/Release-iphonesimulator/Flatsby.app
          xcrun simctl launch "$UDID" com.flatcove.app.v2 || true
          sleep 15
          xcrun simctl terminate "$UDID" com.flatcove.app.v2 || true

      - name: Capture store screenshots
        working-directory: apps/expo
        run: |
          mkdir -p e2e/results/screenshots
          node e2e/run-flows.mjs ../screenshots/store-screenshots
        env:
          E2E_API_URL: ${{ steps.shots.outputs.url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Boot iPad simulator
        id: ipad
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl shutdown "$UDID" || true
          pick() {
            xcrun simctl list devices available --json | jq -r --arg re "$1" '
              [.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                | select(.name | test($re))
                | {udid, n: ([.name | scan("[0-9]+") | tonumber] | first // 0)}]
              | sort_by(.n) | last // {} | .udid // empty'
          }
          UDID_IPAD=$(pick "^iPad Pro")
          [ -z "$UDID_IPAD" ] && UDID_IPAD=$(pick "^iPad")
          if [ -z "$UDID_IPAD" ]; then
            echo "::error::No iPad simulator available on this image"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl erase "$UDID_IPAD"
          xcrun simctl boot "$UDID_IPAD"
          xcrun simctl bootstatus "$UDID_IPAD"
          xcrun simctl spawn "$UDID_IPAD" defaults write com.apple.Accessibility ReduceMotionEnabled 1
          xcrun simctl spawn "$UDID_IPAD" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl ui "$UDID_IPAD" appearance dark
          xcrun simctl status_bar "$UDID_IPAD" override \
            --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --batteryState charged --batteryLevel 100
          echo "udid=$UDID_IPAD" >> "$GITHUB_OUTPUT"

      - name: Install and pre-warm app on iPad
        env:
          UDID: ${{ steps.ipad.outputs.udid }}
        run: |
          xcrun simctl install "$UDID" apps/expo/ios/build/Build/Products/Release-iphonesimulator/Flatsby.app
          xcrun simctl launch "$UDID" com.flatcove.app.v2 || true
          sleep 15
          xcrun simctl terminate "$UDID" com.flatcove.app.v2 || true

      - name: Capture iPad store screenshots
        working-directory: apps/expo
        run: node e2e/run-flows.mjs ../screenshots/store-screenshots-ipad
        env:
          E2E_API_URL: ${{ steps.shots.outputs.url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Dump Maestro debug output
        if: failure()
        working-directory: apps/expo
        run: |
          echo "::group::debug bundle contents"
          find e2e/results -type f -exec ls -la {} + 2>/dev/null || true
          echo "::endgroup::"
          for d in e2e/results/debug-*/; do
            [ -d "$d" ] || continue
            echo "::group::${d} flow errors"
            grep -rhoE "(Element not found|Assertion is false|AssertionFailure|Invalid point)[^\"]*" "$d" 2>/dev/null | sort | uniq -c | sort -rn | head -20 || true
            echo "::endgroup::"
            find "$d" -name "*.log" | while read -r log; do
              echo "::group::${log} (tail)"
              tail -n 300 "$log" || true
              echo "::endgroup::"
            done
          done

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-store-screenshots-ios
          path: apps/expo/e2e/results/
          include-hidden-files: true
          retention-days: 7
