# Temporary: dumps the iOS store-screenshot debug bundle from release run
# 31163183838 into the job log, because the artifact itself is unreachable
# from the analysis environment. Delete after diagnosis.
name: Debug artifact dump
on:
  push:
    branches: [claude/release-pipeline-logs-ig26ju]
permissions:
  actions: read
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: store-screenshots-ios
          run-id: 31163183838
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results

      - name: File listing
        run: find results -type f -exec ls -la {} \; | sort -k9

      - name: Maestro flow logs
        run: |
          find results -path '*store-screenshots/logs/maestro.log' | sort | while read -r mlog; do
            echo "::group::$mlog tail"
            tail -n 200 "$mlog"
            echo "::endgroup::"
          done
          find results -name maestro.log -not -path '*store-screenshots*' | sort | while read -r mlog; do
            echo "::group::$mlog errors"
            grep -inE "error|fail|exception|crash|unreachable" "$mlog" | tail -n 60 || true
            echo "::endgroup::"
          done

      - name: Failed commands
        run: |
          find results -name 'commands*.json' | sort | while read -r cj; do
            echo "::group::$cj"
            jq -c '.. | objects | select((.status? // "") | test("FAIL|WARN")) ' "$cj" 2>/dev/null | tail -c 6000 || true
            echo "::endgroup::"
          done

      - name: Failure screenshots as base64
        run: |
          find results -path '*.maestro*' -name '*.png' | grep -E '/screenshots/|/takeScreenshot/' | sort | while read -r png; do
            echo "=== BEGIN B64 $png ==="
            base64 -w 3000 "$png"
            echo "=== END B64 $png ==="
          done
