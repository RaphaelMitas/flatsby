# Temporary: dumps the captured store screenshots from the test run so they
# can be reviewed. Delete before merging.
name: Debug artifact dump
on:
  push:
    branches: [claude/release-pipeline-logs-ig26ju]
permissions:
  actions: read
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test-store-screenshots-ios
          run-id: 31217054650
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results

      - name: File listing
        run: find results -type f -exec ls -la {} \; | sort -k9 | grep -v ".maestro"

      - name: Screenshots as base64
        run: |
          find results/screenshots -name '*.png' | sort | while read -r png; do
            echo "=== BEGIN B64 $png ==="
            base64 -w 3000 "$png"
            echo "=== END B64 $png ==="
          done
