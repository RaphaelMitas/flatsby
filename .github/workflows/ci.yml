name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.org/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  # Stream task logs live; the GHA default ("grouped") buffers all output until
  # a task finishes, which looks like a hang and loses logs on job timeout.
  TURBO_LOG_ORDER: stream
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Check
        run: pnpm check && pnpm lint:ws

      - name: Release notes fit Play's 500 character limit
        run: |
          node -e '
            const n = require("fs").readFileSync("apps/expo/store/release-notes.txt", "utf8").length;
            if (n > 500) {
              console.error(`apps/expo/store/release-notes.txt is ${n} characters; Play allows 500.`);
              process.exit(1);
            }
          '

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Audit
        run: pnpm audit

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Typecheck
        run: pnpm typecheck
