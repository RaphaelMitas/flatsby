packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: false

# Transitive vulnerabilities with no upstream fix path: each is held back by a
# parent package we do not control, via an exact pin or a range that excludes the
# patched release. Re-check with `pnpm audit` and drop entries as upstream ships.
auditConfig:
  ignoreGhsas:
    # esbuild <=0.24.2 - drizzle-kit@0.31.11 (latest) > @esbuild-kit/esm-loader >
    # @esbuild-kit/core-utils@3.3.2, which pins ~0.18.20. The @esbuild-kit packages
    # are deprecated (folded into tsx); clears when drizzle-kit drops esm-loader.
    - GHSA-67mh-4wv8-2f99
    # zod <4.6.6 - only 4.x is patched and 3.25.76 is the last 3.x. Every @expo/cli
    # 58.x (latest 58.1.16) depends on zod ^3.25.76, dev tooling only. Clears when
    # @expo/cli moves to zod 4.
    - GHSA-mrhx-c7xc-m3w5
    # deepmerge <=4.3.1 - no patched release exists; 4.3.1 is npm's latest and
    # unchanged since 2023. Reached via @expo/config@58.0.8 (latest) merging app
    # config at build time, never untrusted input.
    - GHSA-gcqx-w48m-w2h4
    # glob <=14.0.1 and minimatch <11.0.1 - patched only in the new majors. Every
    # Expo 58 package (canary included) depends on glob ^13, @expo/fingerprint also
    # on minimatch ^10. react-email 6 also depends on glob ^13 for its preview CLI.
    # Build tooling globbing our own project, no abort signals or untrusted input.
    # Clears when Expo and react-email move to glob 14 and Expo to minimatch 11.
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249

catalog:
  "@ai-sdk/provider": ^4.0.29
  "@ai-sdk/react": ^4.0.147
  "@biomejs/biome": 2.5.15
  "@effect/tsgo": 0.63.0
  "@effect/vitest": 4.0.5
  "@hookform/resolvers": ^6.0.0
  "@playwright/test": ^1.64.1
  "@t3-oss/env-nextjs": ^0.13.11
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/query-async-storage-persister": ^5.104.5
  "@tanstack/react-query": ^5.104.5
  "@tanstack/react-query-persist-client": ^5.104.5
  "@trpc/client": ^11.19.0
  "@trpc/server": ^11.19.0
  "@trpc/tanstack-react-query": ^11.19.0
  "@turbo/gen": ^2.11.9
  "@types/node": ^24.19.2
  ai: ^7.0.143
  autumn-js: ^1.5.9
  babel-plugin-react-compiler: ^1.0.0
  next: ^16.4.2
  next-intl: ^4.14.9
  prettier: ^3.9.10
  react-hook-form: ^7.90.0
  react-qr-code: ^2.2.0
  superjson: ^2.2.6
  tailwindcss: ^4.3.3
  turbo: ^2.11.9
  # exact: each @effect/tsgo release supports specific TypeScript versions
  typescript: 7.0.2
  use-intl: ^4.14.9
  vitest: ^5.0.5
  zod: ^4.6.7

catalogs:
  better-auth:
    # 1.6.24+ breaks the Expo client plugin types: expoClient no longer satisfies
    # BetterAuthClientPlugin and authClient.getCookie loses its type.
    # https://github.com/better-auth/better-auth/issues/10767
    "@better-auth/expo": 1.7.11
    "@better-auth/passkey": 1.7.11
    better-auth: 1.7.11
  react19:
    "@types/react": ~19.3.0
    "@types/react-dom": ~19.3.0
    react: 19.3.0
    react-dom: 19.3.0

linkWorkspacePackages: true

# Keep renovate.json minimumReleaseAge a day above this: Renovate ages only the parent, pnpm also its later-published platform binaries
minimumReleaseAge: 1440

nodeLinker: hoisted

overrides:
  # lightningcss > 1.30.1 breaks the CSS transform Metro loads via
  # @expo/metro-config with "failed to deserialize ... named Specifier"
  # (parcel-bundler/lightningcss#1065). Only this copy matters: with it pinned
  # the hoisted root sits on 1.32.0 and both platforms still bundle, so the
  # react-native-css pin that used to sit here was dead weight.
  # @tailwindcss/node is Next-only, left alone.
  '@expo/metro-config>lightningcss': 1.30.1

# Fixes every bg-x/N rendering transparent on native until a release ships it: https://github.com/nativewind/react-native-css/issues/481
patchedDependencies:
  react-native-css@3.1.0-rc.0: patches/react-native-css@3.1.0-rc.0.patch

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
