packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: false

# Transitive vulnerabilities with no upstream fix path: each is held back by a
# parent package we do not control, via an exact pin or a range that excludes the
# patched release. Re-check with `pnpm audit` and drop entries as upstream ships.
auditConfig:
  ignoreGhsas:
    # esbuild <=0.24.2 - drizzle-kit@0.31.10 (latest) > @esbuild-kit/esm-loader >
    # @esbuild-kit/core-utils@3.3.2, which pins ~0.18.20. The @esbuild-kit packages
    # are deprecated (folded into tsx); clears when drizzle-kit drops esm-loader.
    - GHSA-67mh-4wv8-2f99
    # uuid <11.1.1 - xcode@3.0.1 (latest) pins ^7.0.3, and @expo/config-plugins
    # still depends on xcode ^3.0.1 as of 57.x. Reached via the direct dependency
    # @react-native-vector-icons/lucide@13.1.2 (also latest).
    - GHSA-w5hq-g745-h8pq
    # postcss <8.5.10 / <=8.5.11 / <=8.5.17 / <=8.5.22 - next@16.2.x depends on
    # exactly 8.4.31, so no range update can reach a patched release. The workspace's
    # own postcss (tooling/tailwind, Expo Metro, Tailwind) is on 8.5.24 and unaffected.
    - GHSA-qx2v-qp2m-jg93
    - GHSA-6g55-p6wh-862q
    - GHSA-r28c-9q8g-f849
    - GHSA-fxqj-rqcc-2cmp
    # sharp <0.35.0 - next@16.2.x pins sharp ^0.34.5; libvips CVEs fixed in 0.35.0.
    - GHSA-f88m-g3jw-g9cj

catalog:
  "@ai-sdk/provider": ^3.0.14
  "@ai-sdk/react": ^3.0.245
  "@eslint/js": ^10.0.1
  "@t3-oss/env-nextjs": ^0.13.11
  "@tailwindcss/postcss": ^4.3.1
  "@tanstack/react-query": ^5.101.4
  "@trpc/client": ^11.18.0
  "@trpc/server": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  "@turbo/gen": ^2.10.0
  "@types/node": ^24.13.3
  ai: ^6.0.243
  autumn-js: ^1.2.49
  babel-plugin-react-compiler: ^1.0.0
  eslint: ^10.5.0
  next: ^16.2.11
  prettier: ^3.8.4
  superjson: ^2.2.6
  tailwindcss: ^4.3.1
  turbo: ^2.10.0
  typescript: ^6.0.3
  zod: ^4.4.3

catalogs:
  better-auth:
    "@better-auth/expo": 1.6.23
    better-auth: 1.6.23
  react19:
    "@types/react": ~19.2.0
    "@types/react-dom": ~19.2.0
    react: 19.2.0
    react-dom: 19.2.0

linkWorkspacePackages: true

minimumReleaseAge: 1440

nodeLinker: hoisted

overrides:
  # Better Auth 1.6.12's SQLite dialect bundle imports Kysely migration
  # constants removed in 0.29.x during Next/Turbopack builds.
  kysely: 0.29.4
  # NativeWind v5 / Lightning CSS deserialization regression workaround.
  lightningcss: 1.30.1
  # @istanbuljs/load-nyc-config (via react-native > babel-jest) pins js-yaml 3.x.
  js-yaml: 4.3.1

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
