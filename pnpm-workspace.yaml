packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: false

# Transitive vulnerabilities with no upstream fix path: each is held back by a
# parent package we do not control, via an exact pin or a range that excludes the
# patched release. Re-check with `pnpm audit` and drop entries as upstream ships.
auditConfig:
  ignoreGhsas:
    # esbuild <=0.24.2 - drizzle-kit@0.31.10 (latest) > @esbuild-kit/esm-loader >
    # @esbuild-kit/core-utils@3.3.2, which pins ~0.18.20. The @esbuild-kit packages
    # are deprecated (folded into tsx); clears when drizzle-kit drops esm-loader.
    - GHSA-67mh-4wv8-2f99
    # uuid <11.1.1 - xcode@3.0.1 (latest) pins ^7.0.3, and @expo/config-plugins
    # still depends on xcode ^3.0.1 as of 57.x. Reached via the direct dependency
    # @react-native-vector-icons/lucide@13.1.2 (also latest).
    - GHSA-w5hq-g745-h8pq
    # node-forge <=1.4.0 - no patched release exists; 1.4.0 is npm's latest. Reached
    # via @expo/cli > @expo/code-signing-certificates@0.0.7 (latest), dev tooling only.
    - GHSA-86w9-cpqp-85rv
    # braces <=3.0.3 - no patched release exists; 3.0.3 is npm's latest. Reached via
    # metro and @expo/metro-file-map > micromatch@4.0.8 (latest), bundler only.
    - GHSA-vfj7-8cjw-p6xm
    # decode-uri-component <=0.4.2 - expo-router@57.0.22 pins query-string ^7.1.3,
    # and every 7.x pins decode-uri-component ^0.2.2. The patched 0.5.0 is ESM-only,
    # so an override would break query-string's require(). Clears when expo-router
    # moves to query-string 9.
    - GHSA-vcc3-ghjq-m6fr

catalog:
  "@ai-sdk/provider": ^4.0.18
  "@ai-sdk/react": ^4.0.121
  "@biomejs/biome": 2.5.14
  "@hookform/resolvers": ^5.9.1
  "@t3-oss/env-nextjs": ^0.13.11
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-query": ^5.104.0
  "@trpc/client": ^11.19.0
  "@trpc/server": ^11.19.0
  "@trpc/tanstack-react-query": ^11.19.0
  "@turbo/gen": ^2.11.4
  "@types/node": ^24.19.0
  ai: ^7.0.118
  autumn-js: ^1.3.28
  babel-plugin-react-compiler: ^1.0.0
  next: ^16.4.0
  prettier: ^3.9.9
  react-hook-form: ^7.89.0
  superjson: ^2.2.6
  tailwindcss: ^4.3.3
  turbo: ^2.11.4
  typescript: ^7.0.2
  zod: ^4.6.5

catalogs:
  better-auth:
    # 1.6.24+ breaks the Expo client plugin types: expoClient no longer satisfies
    # BetterAuthClientPlugin and authClient.getCookie loses its type.
    # https://github.com/better-auth/better-auth/issues/10767
    "@better-auth/expo": 1.7.6
    better-auth: 1.7.6
  react19:
    "@types/react": ~19.2.0
    "@types/react-dom": ~19.2.0
    react: 19.2.8
    react-dom: 19.2.8

linkWorkspacePackages: true

minimumReleaseAge: 1440

nodeLinker: hoisted

overrides:
  # lightningcss > 1.30.1 breaks the CSS transform Metro loads via
  # @expo/metro-config with "failed to deserialize ... named Specifier"
  # (parcel-bundler/lightningcss#1065). Only this copy matters: with it pinned
  # the hoisted root sits on 1.32.0 and both platforms still bundle, so the
  # react-native-css pin that used to sit here was dead weight.
  # @tailwindcss/node is Next-only, left alone.
  '@expo/metro-config>lightningcss': 1.30.1

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
