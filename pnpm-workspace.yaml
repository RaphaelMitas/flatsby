packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: false

# Transitive vulnerabilities held back by a parent package. Each clears when that
# parent ships a fix or we bump it. Re-check with `pnpm audit` and drop entries.
auditConfig:
  ignoreGhsas:
    # esbuild <=0.24.2 - drizzle-kit@0.31.11 (latest) > @esbuild-kit/esm-loader >
    # @esbuild-kit/core-utils@3.3.2, which pins ~0.18.20. The @esbuild-kit packages
    # are deprecated (folded into tsx); clears when drizzle-kit drops esm-loader.
    - GHSA-67mh-4wv8-2f99
    # zod <4.6.6 - only 4.x is patched and 3.25.76 is the last 3.x. @expo/cli
    # <=58.1.17 depends on zod ^3.25.76, dev tooling only. Clears with expo >=58.0.22.
    - GHSA-mrhx-c7xc-m3w5
    # deepmerge <=4.3.1 - no patched release exists. Reached via @expo/config <=58.0.9
    # merging app config at build time, never untrusted input. Clears with expo >=58.0.22.
    - GHSA-gcqx-w48m-w2h4
    # glob <=14.0.1 and minimatch <11.0.1 - patched only in the new majors. Every
    # Expo 58 package (canary included) depends on glob ^13, @expo/fingerprint also
    # on minimatch ^10. Build tooling globbing our own project, no abort signals or
    # untrusted input. Clears when Expo moves to glob 14 and minimatch 11.
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249

catalog:
  "@ai-sdk/provider": ^4.0.37
  "@biomejs/biome": 2.6.7
  "@effect/tsgo": 0.68.1
  "@effect/vitest": 4.1.4
  "@hookform/resolvers": ^7.0.6
  "@playwright/test": ^1.65.0
  "@t3-oss/env-nextjs": ^0.13.11
  "@tailwindcss/postcss": ^4.3.5
  "@tanstack/query-async-storage-persister": ^5.107.1
  "@tanstack/react-query": ^5.107.1
  "@tanstack/react-query-persist-client": ^5.107.1
  "@trpc/client": ^11.28.0
  "@trpc/server": ^11.28.0
  "@trpc/tanstack-react-query": ^11.28.0
  "@turbo/gen": ^2.11.11
  "@types/node": ^26.6.6
  ai: ^7.0.170
  babel-plugin-react-compiler: ^1.0.0
  next: ^16.4.6
  next-intl: ^4.15.0
  prettier: ^3.10.0
  react-hook-form: ^7.92.0
  react-qr-code: ^2.2.0
  superjson: ^2.2.6
  tailwindcss: ^4.3.5
  turbo: ^2.11.11
  # exact: each @effect/tsgo release supports specific TypeScript versions
  typescript: 7.0.2
  use-intl: ^4.15.0
  vitest: ^5.1.0
  zod: ^4.6.7

catalogs:
  better-auth:
    "@better-auth/expo": 1.7.21
    "@better-auth/passkey": 1.7.21
    better-auth: 1.7.21
  react19:
    "@types/react": ~19.3.0
    "@types/react-dom": ~19.3.0
    react: 19.3.0
    react-dom: 19.3.0

linkWorkspacePackages: true

# Keep renovate.json minimumReleaseAge a day above this: Renovate ages only the parent, pnpm also its later-published platform binaries
minimumReleaseAge: 1440

nodeLinker: hoisted

overrides:
  # lightningcss > 1.30.1 breaks the CSS transform Metro loads via
  # @expo/metro-config with "failed to deserialize ... named Specifier"
  # (parcel-bundler/lightningcss#1065). Only this copy matters: with it pinned
  # the hoisted root sits on 1.32.0 and both platforms still bundle, so the
  # react-native-css pin that used to sit here was dead weight.
  # @tailwindcss/node is Next-only, left alone.
  '@expo/metro-config>lightningcss': 1.30.1

# Fixes every bg-x/N rendering transparent on native until a release ships it: https://github.com/nativewind/react-native-css/issues/481
patchedDependencies:
  react-native-css@3.1.0-rc.0: patches/react-native-css@3.1.0-rc.0.patch

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
