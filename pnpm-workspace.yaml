packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: false

# Transitive vulnerabilities with no upstream fix path: each is held back by a
# parent package we do not control, via an exact pin or a range that excludes the
# patched release. Re-check with `pnpm audit` and drop entries as upstream ships.
auditConfig:
  ignoreGhsas:
    # esbuild <=0.24.2 - drizzle-kit@0.31.10 (latest) > @esbuild-kit/esm-loader >
    # @esbuild-kit/core-utils@3.3.2, which pins ~0.18.20. The @esbuild-kit packages
    # are deprecated (folded into tsx); clears when drizzle-kit drops esm-loader.
    - GHSA-67mh-4wv8-2f99
    # uuid <11.1.1 - xcode@3.0.1 (latest) pins ^7.0.3, and @expo/config-plugins
    # still depends on xcode ^3.0.1 as of 57.x. Reached via the direct dependency
    # @react-native-vector-icons/lucide@13.1.2 (also latest).
    - GHSA-w5hq-g745-h8pq
    # image-size <=2.0.2 - no patched release exists yet: the advisories name 2.0.3
    # but npm's latest is 2.0.2. metro (0.84.4 here, 0.87.0 latest) also depends on
    # ^1.0.2, so the fix needs both an upstream release and a metro range bump.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

catalog:
  "@ai-sdk/provider": ^4.0.7
  "@ai-sdk/react": ^4.0.69
  "@biomejs/biome": 2.5.8
  "@hookform/resolvers": ^5.9.0
  "@t3-oss/env-nextjs": ^0.13.11
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-query": ^5.101.4
  "@trpc/client": ^11.18.0
  "@trpc/server": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  "@turbo/gen": ^2.10.10
  "@types/node": ^24.13.3
  ai: ^7.0.66
  autumn-js: ^1.2.53
  babel-plugin-react-compiler: ^1.0.0
  next: ^16.3.1
  prettier: ^3.9.6
  react-hook-form: ^7.85.0
  superjson: ^2.2.6
  tailwindcss: ^4.3.3
  turbo: ^2.10.10
  typescript: ^7.0.2
  zod: ^4.4.3

catalogs:
  better-auth:
    # 1.6.24+ breaks the Expo client plugin types: expoClient no longer satisfies
    # BetterAuthClientPlugin and authClient.getCookie loses its type.
    # https://github.com/better-auth/better-auth/issues/10767
    "@better-auth/expo": 1.6.29
    better-auth: 1.6.29
  react19:
    "@types/react": ~19.2.0
    "@types/react-dom": ~19.2.0
    react: 19.2.8
    react-dom: 19.2.8

linkWorkspacePackages: true

minimumReleaseAge: 1440

nodeLinker: hoisted

overrides:
  # lightningcss > 1.30.1 breaks the CSS transform Metro loads via
  # @expo/metro-config with "failed to deserialize ... named Specifier"
  # (parcel-bundler/lightningcss#1065). Only this copy matters: with it pinned
  # the hoisted root sits on 1.32.0 and both platforms still bundle, so the
  # react-native-css pin that used to sit here was dead weight.
  # @tailwindcss/node is Next-only, left alone.
  '@expo/metro-config>lightningcss': 1.30.1

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
