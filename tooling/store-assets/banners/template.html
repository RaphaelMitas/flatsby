<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      .bubble {
        position: absolute;
        z-index: 4;
      }
      .bubble.out::before {
        left: auto;
        right: -0.36em;
        transform: scaleX(-1);
      }
      h1 {
        position: absolute;
        z-index: 5;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .crop {
        position: absolute;
        background-color: #09090b;
        background-repeat: no-repeat;
        overflow: hidden;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { loadImage, place, placeCat } from "/compose.js";

      const q = new URLSearchParams(location.search);
      const asset = q.get("asset") ?? "search";
      const lang = q.get("lang") ?? "en";
      const video = q.has("video");
      const src = (name) => `/captures/ios/${lang}/${name}.png`;

      // `card` crops are whole cards, so they keep the card's rounded corner radius.
      const REGIONS = {
        internet: { crop: "crop-expense-internet", card: true },
        yourTurn: { crop: "crop-row-bins" },
        oatMilk: { crop: "crop-item-oat-milk", card: true },
        owed: { crop: "crop-balance", trim: 0.24 },
      };
      const CARD_RADIUS = 44;

      // `right` anchors a bubble to the right edge so longer German copy grows inward.
      const LAYOUTS = {
        search: {
          width: 1920,
          bubbles: [
            { right: 380, y: 700, rot: 3, size: 54 },
            { right: 190, y: 196, rot: 3.5, size: 56, out: true },
            { x: 190, y: 92, rot: -3.5, size: 56 },
          ],
          headline: { x: 360, y: 384, w: 1200, size: 100, lines: 2 },
          crops: [
            { region: "internet", x: 390, y: 606, w: 1140 },
            { region: "yourTurn", x: 130, y: 1046, w: 810 },
            {
              region: "oatMilk",
              x: 980,
              y: 1054,
              w: 810,
              cat: { size: 340, cut: 0.555, at: 0.85 },
            },
          ],
        },
        header: {
          width: 1920,
          bubbles: [
            { right: 1350, y: 180, rot: -5, size: 42 },
            { right: 1390, y: 500, rot: 4, size: 42, out: true },
          ],
          headline: { x: 548, y: 280, w: 823, size: 132, lines: 2 },
          crops: [
            {
              region: "owed",
              x: 1400,
              y: 400,
              w: 400,
              cat: { size: 620, cut: 0.555 },
            },
          ],
          // The video opens with the app answering each bubble before settling into the banner.
          intro: {
            bubbles: [
              { x: 300, y: 150, rot: -3, size: 52 },
              { x: 380, y: 520, rot: 3, size: 52 },
            ],
            crops: [
              { region: "internet", x: 1040, y: 110, w: 580 },
              { region: "oatMilk", x: 1040, y: 530, w: 580 },
            ],
          },
        },
        play: {
          width: 1024,
          bubbles: [
            { x: 168, y: 168, rot: -4, size: 20 },
            { x: 186, y: 228, rot: 3, size: 20, out: true },
            { x: 168, y: 288, rot: -2, size: 20 },
          ],
          headline: { x: 172, y: 78, w: 680, size: 62, lines: 1 },
          crops: [
            {
              region: "owed",
              x: 612,
              y: 204,
              w: 250,
              cat: { size: 180, cut: 0.53 },
            },
            { region: "yourTurn", x: 232, y: 338, w: 560 },
          ],
        },
      };

      fetch("captions.json")
        .then((r) => r.json())
        .then(async (captions) => {
          const copy = captions[lang][asset];
          const layout = LAYOUTS[asset];
          const intro = video ? layout.intro : undefined;
          const u = window.innerWidth / layout.width;
          const px = (n) => `${n * u}px`;
          document.documentElement.lang = lang;

          const names = new Set(
            [...layout.crops, ...(intro?.crops ?? [])].map(
              (c) => REGIONS[c.region].crop,
            ),
          );
          const [images] = await Promise.all([
            Promise.all(
              [...names].map(async (n) => [n, await loadImage(src(n))]),
            ).then(Object.fromEntries),
            loadImage("/brand/adaptive-icon.png"),
            document.fonts.load('900 100px "Inter"'),
            document.fonts.load('600 100px "Inter"'),
          ]);

          const placeCrop = (c, parent) => {
            const group = place("scene", {}, parent);
            const { crop, card, trim = 0 } = REGIONS[c.region];
            const { naturalWidth, naturalHeight } = images[crop];
            const s = (c.w * u) / (naturalWidth * (1 - 2 * trim));
            place(
              "crop",
              {
                left: px(c.x),
                top: px(c.y),
                width: px(c.w),
                height: `${naturalHeight * s}px`,
                borderRadius: card ? `${CARD_RADIUS * s}px` : px(c.w * 0.045),
                boxShadow: `0 ${px(c.w * 0.02)} ${px(c.w * 0.07)} rgba(9, 9, 11, 0.28)`,
                backgroundImage: `url("${src(crop)}")`,
                backgroundSize: `${naturalWidth * s}px auto`,
                backgroundPosition: `${-trim * naturalWidth * s}px 0`,
              },
              group,
            );
            if (c.cat) {
              const { size, cut, at = 0.5 } = c.cat;
              placeCat(
                {
                  size: size * u,
                  cut,
                  centerX: (c.x + c.w * at) * u,
                  bottom: c.y * u,
                },
                group,
              );
            }
            return group;
          };

          const placeBubble = (b, text, parent) => {
            const el = place(
              `bubble${b.out ? " out" : ""}`,
              {
                fontSize: px(b.size),
                top: px(b.y),
                transform: `rotate(${b.rot}deg)`,
              },
              parent,
            );
            el.textContent = text;
            if (b.right !== undefined) el.style.right = px(b.right);
            else el.style.left = px(b.x);
            return el;
          };

          const scene = place("scene", {});
          const introScene = intro && place("scene", {}, scene);
          const groups = layout.crops.map((c) => placeCrop(c, scene));
          const bubbles = layout.bubbles.map((b, i) =>
            placeBubble(b, copy.bubbles[i], scene),
          );

          const h = layout.headline;
          const h1 = document.createElement("h1");
          // Sentences become spans so the video can land them one at a time.
          const lines = (
            video ? copy.headline.split(/(?<=\.) /) : [copy.headline]
          ).map((line) => {
            const span = document.createElement("span");
            span.textContent = line;
            if (video) span.style.display = "inline-block";
            h1.append(span, " ");
            return span;
          });
          Object.assign(h1.style, {
            left: px(h.x),
            top: px(h.y),
            width: px(h.w),
          });
          scene.appendChild(h1);
          let size = h.size;
          const fit = () => {
            h1.style.fontSize = px(size);
            return (
              h1.offsetHeight <= (h.lines + 0.5) * size * 0.98 * u &&
              h1.scrollWidth <= h1.clientWidth
            );
          };
          while (!fit() && size > h.size * 0.6) size -= 2;

          if (intro) {
            // Paused animations on an absolute timeline; render.mjs steps currentTime frame by frame.
            const at = (el, frames, easing = "cubic-bezier(.2,.8,.3,1)") => {
              const t0 = frames[0][0];
              const t1 = frames.at(-1)[0];
              el.animate(
                frames.map(([t, f]) => ({
                  ...f,
                  offset: (t - t0) / (t1 - t0),
                })),
                { delay: t0, duration: t1 - t0, fill: "both", easing },
              ).pause();
            };
            const pop = (el, t) => {
              const rot = el.style.transform;
              el.style.transformOrigin = el.classList.contains("out")
                ? "100% 100%"
                : "0 100%";
              at(el, [
                [
                  t,
                  {
                    opacity: 0,
                    transform: `${rot} scale(.5) translateY(${px(40)})`,
                  },
                ],
                [t + 290, { opacity: 1, transform: `${rot} scale(1.06)` }],
                [t + 450, { opacity: 1, transform: rot }],
              ]);
            };

            intro.bubbles.forEach((b, i) =>
              pop(placeBubble(b, copy.bubbles[i], introScene), [200, 1900][i]),
            );
            intro.crops.forEach((c, i) => {
              const t = [1000, 2700][i];
              at(placeCrop(c, introScene), [
                [t, { opacity: 0, transform: `translateX(${px(120)})` }],
                [t + 600, { opacity: 1, transform: "none" }],
              ]);
            });
            at(
              introScene,
              [
                [4300, { opacity: 1, transform: "none" }],
                [
                  4800,
                  {
                    opacity: 0,
                    transform: `translateY(${px(-60)}) scale(.96)`,
                  },
                ],
              ],
              "ease-in",
            );

            bubbles.forEach((el, i) => pop(el, 4800 + i * 250));
            lines.forEach((el, i) =>
              at(
                el,
                [
                  [5300 + i * 300, { opacity: 0, transform: "scale(1.3)" }],
                  [5680 + i * 300, { opacity: 1, transform: "none" }],
                ],
                "cubic-bezier(.3,1.4,.5,1)",
              ),
            );
            // The card slides in opaque from below the frame with its cat
            // half up, and the cat stretches to full height as the card lands.
            for (const group of groups) {
              const top = Math.min(
                ...[...group.children].map(
                  (e) => e.getBoundingClientRect().top,
                ),
              );
              at(
                group,
                [
                  [
                    5800,
                    { transform: `translateY(${window.innerHeight - top}px)` },
                  ],
                  [6450, { transform: "none" }],
                ],
                "cubic-bezier(.2,1.1,.4,1)",
              );
              const cat = group.querySelector(".cat");
              if (!cat) continue;
              cat.style.transformOrigin = "50% 100%";
              at(
                cat,
                [
                  [6180, { transform: "scale(1, .55)" }],
                  [6360, { transform: "scale(.95, 1.12)" }],
                  [6540, { transform: "scale(1.02, .97)" }],
                  [6680, { transform: "none" }],
                ],
                "ease-out",
              );
            }
            at(
              scene,
              [
                [9300, { opacity: 1 }],
                [9900, { opacity: 0 }],
              ],
              "ease-in",
            );
            document.body.dataset.duration = 10_000;
          }
          document.body.dataset.ready = "true";
        });
    </script>
  </body>
</html>
