<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/common.css" />
    <style>
      header {
        position: absolute;
        top: 2.4vh;
        left: 5vw;
        right: 5vw;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .bubble {
        font-size: 5vw;
        margin-bottom: 2.6vw;
        transform: rotate(-1.5deg);
      }
      h1 {
        font-size: 12.4vw;
      }
      .card,
      .zoom {
        position: absolute;
        overflow: hidden;
        background: #09090b;
      }
      .card {
        border-radius: 5vw;
        box-shadow: 0 2vw 7vw rgba(9, 9, 11, 0.28);
        z-index: 2;
      }
      .segment {
        background-repeat: no-repeat;
      }
      .mask {
        position: absolute;
        background: #09090b;
      }
      .zoom {
        z-index: 3;
        background-repeat: no-repeat;
        border-radius: 3.6vw;
        box-shadow:
          0 3vw 8vw rgba(9, 9, 11, 0.5),
          0 0 0 0.35vw rgba(255, 255, 255, 0.16);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bubble" id="bubble"></div>
      <h1 id="h"></h1>
    </header>
    <script type="module">
      import {
        loadImage,
        locate,
        place,
        placeCat,
        trimX,
        union,
      } from "/compose.js";

      const q = new URLSearchParams(location.search);
      const platform = q.get("platform") ?? "ios";
      const lang = q.get("lang") ?? "en";
      const index = Number(q.get("frame") ?? 0);
      const vw = window.innerWidth / 100;
      const H = window.innerHeight;

      const pick = (value) =>
        value && typeof value === "object" && platform in value
          ? value[platform]
          : value;
      const src = (capture) => `/captures/${platform}/${lang}/${capture}.png`;

      // Store guidance (Google Play) wants captions in roughly the top fifth of the frame.
      const captionLimit = 0.215 * H;
      const fitHeadline = (h1, maxLines) => {
        let size = 12.4;
        h1.style.fontSize = `${size}vw`;
        const tooBig = () =>
          h1.offsetHeight > (maxLines + 0.5) * size * 0.98 * vw ||
          h1.scrollWidth > h1.clientWidth ||
          h1.getBoundingClientRect().bottom > captionLimit;
        while (tooBig() && size > 8) {
          size -= 0.2;
          h1.style.fontSize = `${size}vw`;
        }
      };

      fetch("captions.json")
        .then((r) => r.json())
        .then(async (frames) => {
          const frame = frames[index];
          document.documentElement.lang = lang;
          document.getElementById("bubble").textContent = frame.bubble[lang];
          const h1 = document.getElementById("h");
          h1.textContent = frame.headline[lang];

          const captures = [
            ...new Set([
              ...[...frame.cards, ...frame.zooms].map((c) => c.capture),
              ...frame.zooms.flatMap((z) => z.crop),
            ]),
          ];
          const images = Object.fromEntries(
            await Promise.all(
              captures.map(async (c) => [c, await loadImage(src(c))]),
            ),
          );
          for (const z of frame.zooms) {
            const capture = images[z.capture];
            const box = trimX(
              union([z.crop].flat().map((c) => locate(capture, images[c]))),
              z.trim,
            );
            z.region = [
              box[0] / capture.naturalWidth,
              box[1] / capture.naturalHeight,
              box[2] / capture.naturalWidth,
              box[3] / capture.naturalHeight,
            ];
          }
          // The cat is a CSS background, which the screenshot would not wait for.
          if (frame.cat) await loadImage("/brand/adaptive-icon.png");
          await document.fonts.ready;
          fitHeadline(h1, frame.lines ?? 2);

          const gap = 3.2 * vw;
          const zoneTop =
            document.querySelector("header").getBoundingClientRect().bottom +
            5 * vw;
          const catTop = frame.cat
            ? H -
              placeCat({
                size: frame.cat.size * vw,
                cut: frame.cat.cut,
                centerX: window.innerWidth / 2,
                bottom: H,
              })
            : H;
          const zoneBottom = catTop - 4 * vw;
          const ratio = (c) =>
            images[c.capture].naturalHeight / images[c.capture].naturalWidth;
          const cardAspect = (c) =>
            pick(c.segments).reduce(
              (sum, [a, b]) => sum + (b - a) * ratio(c),
              0,
            );
          const zoomBox = (z) => {
            const [, , w, h] = z.region;
            const width = z.width * vw;
            return { width, height: (width * h * ratio(z)) / w };
          };

          const stacked = frame.zooms.filter((z) => z.stack);
          const fixed =
            stacked.reduce(
              (sum, z) => sum + zoomBox(z).height - z.overlap * vw,
              0,
            ) +
            gap * (frame.cards.length - 1);
          const aspects = frame.cards.reduce(
            (sum, c) => sum + cardAspect(c),
            0,
          );
          const width = Math.min(
            96 * vw,
            (zoneBottom - zoneTop - fixed) / aspects,
          );
          const total = width * aspects + fixed;
          let y = zoneTop + (zoneBottom - zoneTop - total) / 2;
          const left = (window.innerWidth - width) / 2;

          const cardTops = frame.cards.map((c) => {
            const top = y;
            const fullHeight = width * ratio(c);
            const card = place("card", {
              left: `${left}px`,
              top: `${top}px`,
              width: `${width}px`,
            });
            for (const [a, b] of pick(c.segments)) {
              const seg = place(
                "segment",
                {
                  position: "relative",
                  height: `${(b - a) * fullHeight}px`,
                  backgroundImage: `url("${src(c.capture)}")`,
                  backgroundSize: `${width}px auto`,
                  backgroundPosition: `0 ${-a * fullHeight}px`,
                },
                card,
              );
              // Hides a secondary line in repeated list rows and re-centres the kept line on the row.
              const rows = pick(c.rows);
              if (rows) {
                const { x, w, area, keep, shift, step, count } = rows;
                for (let i = 0; i < count; i++) {
                  const off = i * step;
                  if (area[0] + off < a || area[1] + off > b) continue;
                  const box = (y0, y1) => ({
                    left: `${x * width}px`,
                    width: `${w * width}px`,
                    top: `${(y0 - a) * fullHeight}px`,
                    height: `${(y1 - y0) * fullHeight}px`,
                  });
                  place("mask", box(area[0] + off, area[1] + off), seg);
                  place(
                    "mask",
                    {
                      ...box(keep[0] + off + shift, keep[1] + off + shift),
                      backgroundImage: `url("${src(c.capture)}")`,
                      backgroundSize: `${width}px auto`,
                      backgroundPosition: `${-x * width}px ${-(keep[0] + off) * fullHeight}px`,
                    },
                    seg,
                  );
                }
              }
            }
            y += cardAspect(c) * width + gap;
            return { top, segments: pick(c.segments), fullHeight };
          });
          y -= gap;

          for (const z of frame.zooms) {
            const [rx, ry, rw, rh] = z.region;
            const box = zoomBox(z);
            const full = box.width / rw;
            let top;
            if (z.stack) {
              top = y - z.overlap * vw;
              y = top + box.height;
            } else {
              const card = cardTops[z.card];
              const [a, b] = card.segments[0];
              // A layout change can move the row out of the slice the card shows.
              if (ry < a || ry + rh > b) {
                throw new Error(
                  `${z.crop} lies outside its card's first segment`,
                );
              }
              const sourceCenter =
                card.top + (ry - a + rh / 2) * card.fullHeight;
              top = sourceCenter - box.height / 2;
            }
            place("zoom", {
              backgroundImage: `url("${src(z.capture)}")`,
              backgroundSize: `${full}px auto`,
              backgroundPosition: `${-rx * full}px ${-ry * full * ratio(z)}px`,
              width: `${box.width}px`,
              height: `${box.height}px`,
              left: `${(window.innerWidth - box.width) / 2}px`,
              top: `${top}px`,
            });
          }

          document.body.dataset.ready = "true";
        });
    </script>
  </body>
</html>
