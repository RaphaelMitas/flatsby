appId: ${APP_ID}
---
# Store screenshot flow. All content — the group, its three members, the
# stocked list, expenses and the calendar — is seeded server-side by the e2e
# create-session endpoint (`seed=store`), so this flow performs no mutations:
# it logs in, navigates, and captures. Runtime mutations were the pipeline's
# chronic flake: a Maestro tap that silently misses a button (stale coordinates
# after a layout shift) leaves state missing and the flow waiting on UI that
# will never appear. Reads don't have that failure mode — the data exists
# before the app's first query, and query retries cover transient fetch errors.
#
# Navigation taps go through tap-until.yaml (act-verify-repeat) or
# tap-tab.yaml (label -> id on iOS -> position) so a missed tap costs seconds, not
# the run. Run via `node e2e/run-flows.mjs ../screenshots/store-screenshots`;
# E2E_LOCALES="en de" captures each language's household.
#
# The crop-* captures are single elements the store templates lift out of a
# screen; cropping by id keeps them exact whatever the language or layout.
- runScript: store-strings.js
- runFlow:
    file: ../subflows/e2e-login.yaml
    env:
      E2E_USER_NAME: "Alex Rivera"
      E2E_USER_EMAIL: "alex@flatsby.test"
      E2E_SEED: "store"

# The dashboard's only group card is the seeded one.
- extendedWaitUntil:
    visible:
      id: "group-card-name"
      text: ${output.store.group}
    timeout: 45000

# Into the group: the shopping-lists overview with the seeded list card.
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TARGET_ID: "group-select-button"
      MARKER_ID: "shopping-list-create-button"
- extendedWaitUntil:
    visible:
      id: "shopping-lists-group-name"
      text: ${output.store.group}
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "shopping-list-dashboard-link"
    timeout: 45000
- extendedWaitUntil:
    visible: ${output.store.itemsLeft}
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/06-shopping-lists

# Into the seeded list; items are reads, identified by their checkbox ids.
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TARGET_ID: "shopping-list-dashboard-link"
      MARKER_ID: "shopping-list-item-input"
- extendedWaitUntil:
    visible:
      id: "shopping-list-item-checkbox-${output.store.apples}"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "shopping-list-item-checkbox-${output.store.paperTowels}"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/02-shopping-list
- takeScreenshot:
    path: e2e/results/screenshots/${output.locale}/crop-item-oat-milk
    cropOn:
      id: "shopping-list-item-${output.store.oatMilk}"

# Expenses tab with the three seeded expenses.
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-expenses"
      TAB_LABEL: ${output.store.tabExpenses}
      TAB_X: "50%"
      MARKER_ID: "expense-heading"
- extendedWaitUntil:
    visible:
      id: "expense-card-${output.store.weeklyShopping}"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "expense-card-${output.store.cleaningSupplies}"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/03-expenses
- takeScreenshot:
    path: e2e/results/screenshots/${output.locale}/crop-expense-internet
    cropOn:
      id: "expense-card-${output.store.internetBill}"

# The split screenshot needs the form mid-flight: fill Step 1 locally, walk
# to Step 2 (the three-way split), capture, then back out without submitting.
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TARGET_ID: "expense-add-button"
      MARKER_ID: "expense-form-amount"
- tapOn:
    id: "expense-form-amount"
- inputText: "64.30"
- tapOn:
    id: "expense-form-description"
- inputText: ${output.store.description}
# Tap a neutral heading to dismiss the keyboard (hideKeyboard is flaky on iOS)
- tapOn: ${output.store.amountHeading}
- waitForAnimationToEnd
- tapOn:
    id: "expense-form-category"
- waitForAnimationToEnd
# The picker sheet is virtualized: only the top rows exist in the hierarchy
# (run 31262997827's element census), so pick from the visible first group.
- extendedWaitUntil:
    visible:
      id: "picker-item-groceries"
    timeout: 20000
- tapOn:
    id: "picker-item-groceries"
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: "expense-form-next"
          commands:
            - tapOn:
                id: "expense-form-next"
      - extendedWaitUntil:
          visible:
            id: "split-details-card"
          timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/04-expense-split
- takeScreenshot:
    path: e2e/results/screenshots/${output.locale}/crop-split-details
    cropOn:
      id: "split-details-card"

# Back out: Step 2 -> Step 1 -> closed.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: "expense-form-back"
          commands:
            - tapOn:
                id: "expense-form-back"
      - extendedWaitUntil:
          visible:
            id: "expense-form-amount"
          timeout: 15000
# On Step 1 the footer has no back button (expense-form-back renders only on
# later steps) — the way out is the navigation header's back on iOS and the
# hardware back on Android.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          file: ../subflows/tap-until.yaml
          env:
            TARGET_ID: "BackButton"
            MARKER_ID: "expense-heading"
- runFlow:
    when:
      platform: Android
    commands:
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  notVisible:
                    id: "expense-heading"
                commands:
                  - back
            - extendedWaitUntil:
                visible:
                  id: "expense-heading"
                timeout: 15000

# "01a" sorts the calendar right after home in both stores without renaming
# the files the README and landing page link to.
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-calendar"
      TAB_LABEL: ${output.store.tabCalendar}
      TAB_X: "69%"
      MARKER_ID: "calendar-heading"
- extendedWaitUntil:
    visible:
      id: "calendar-day-progress"
      text: "1 .* 3 .*"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/01a-calendar
- takeScreenshot:
    path: e2e/results/screenshots/${output.locale}/crop-row-bathroom
    cropOn:
      id: "calendar-row-${output.store.bathroom}"
      childOf:
        id: "calendar-agenda-today"
- takeScreenshot:
    path: e2e/results/screenshots/${output.locale}/crop-row-bins
    cropOn:
      id: "calendar-row-${output.store.bins}"
      childOf:
        id: "calendar-agenda-today"

# Members screen (reached from the overview's group-settings button); the
# three seeded members are a read, confirmed by the count header's id.
# The Home tab normally comes back on the group's overview — the list detail
# lives in its own tab — but a stray back press while leaving the expense
# form can pop the Home stack to its root (Android, run 31277406593
# attempt 1). Re-enter through the dashboard's nav link in that case rather
# than spending the whole flow rerun on it.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          file: ../subflows/tap-tab.yaml
          env:
            TAB_ID: "tab-home"
            TAB_LABEL: ${output.store.tabHome}
            TAB_X: "12%"
            MARKER_ID: "dashboard-shopping-lists-link|shopping-lists-group-settings"
      - runFlow:
          when:
            visible:
              id: "dashboard-shopping-lists-link"
          commands:
            - runFlow:
                file: ../subflows/tap-until.yaml
                env:
                  TARGET_ID: "dashboard-shopping-lists-link"
                  MARKER_ID: "shopping-lists-group-settings"
      - extendedWaitUntil:
          visible:
            id: "shopping-lists-group-settings"
          timeout: 20000
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TARGET_ID: "shopping-lists-group-settings"
      MARKER_ID: "group-settings-members"
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TARGET_ID: "group-settings-members"
      MARKER_ID: "group-invite-button"
- extendedWaitUntil:
    visible:
      id: "group-members-count-3"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/05-add-member

# Home root: the stats dashboard with the seeded totals. The overview screen
# is pushed on top of it, so pop back after switching tabs.
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-home"
      TAB_LABEL: ${output.store.tabHome}
      TAB_X: "12%"
      MARKER_ID: "shopping-lists-group-name"
- extendedWaitUntil:
    visible:
      id: "shopping-lists-group-name"
      text: ${output.store.group}
    timeout: 20000
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "1%, 50%"
          end: "70%, 50%"
# The hardware back key is swallowed here; the header's standard
# "Navigate up" button pops reliably.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Navigate up"
- extendedWaitUntil:
    visible:
      id: "dashboard-group-picker"
    timeout: 45000
# Store screenshots show the classic home without the invite to the new one
- runFlow:
    when:
      visible:
        id: "home-invite-dismiss"
    commands:
      - tapOn:
          id: "home-invite-dismiss"
- retry:
    maxRetries: 2
    commands:
      - swipe:
          start: "50%, 40%"
          end: "50%, 85%"
      - extendedWaitUntil:
          visible: ".*142.69.*"
          timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/01-home
- takeScreenshot:
    path: e2e/results/screenshots/${output.locale}/crop-balance
    cropOn:
      id: "home-stat-balance"
