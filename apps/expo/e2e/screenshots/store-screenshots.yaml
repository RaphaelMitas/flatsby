appId: ${APP_ID}
---
# Store screenshot flow: logs in via the e2e session endpoint, seeds a
# presentable group with expenses and a shopping list, then captures the
# screens used for App Store / Play Store listings into
# e2e/results/screenshots/. Run via `node e2e/run-flows.mjs
# ../screenshots/store-screenshots` (outside flows/ so the regular e2e suite
# never picks it up).
#
# Ordering matters: expenses and the Home screenshot come before item
# seeding, because the item-entry keyboard covers the tab bar and relaunching
# mid-flow leaves Maestro's iOS hierarchy stale (the screen renders but no
# selector ever matches).
- runFlow:
    file: ../subflows/e2e-login.yaml
    env:
      E2E_USER_NAME: "Alex Rivera"
      E2E_USER_EMAIL: "alex@flatsby.test"

# The e2e fixture group has a generated name ("E2E Test Group 3f2a...");
# create a real-looking one for the screenshots.
- tapOn:
    id: "group-create-button"
- extendedWaitUntil:
    visible:
      id: "group-create-name-input"
    timeout: 45000
- tapOn:
    id: "group-create-name-input"
- inputText: "Sunset Villa"
- tapOn:
    id: "group-create-submit"
- extendedWaitUntil:
    visible: "Sunset Villa"
    timeout: 45000

# Select it (second card; the e2e fixture group is first). The name check
# guards the positional index: the fixture group's screen would pass the
# create-button wait too.
- tapOn:
    id: "group-select-button"
    index: 1
- extendedWaitUntil:
    visible: "Sunset Villa"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "shopping-list-create-button"
    timeout: 45000

# Mint two more e2e users server-side with presentable identities and add
# them as members (group settings live in the Settings tab), so expenses
# split across three people.
- evalScript: "${output.bypass = typeof VERCEL_BYPASS_SECRET !== 'undefined' ? VERCEL_BYPASS_SECRET : ''}"
- evalScript: "${output.memberA = json(http.post(E2E_API_URL + '/api/e2e/create-session?name=Anna%20Keller&email=anna%40flatsby.test', { headers: { 'x-vercel-protection-bypass': output.bypass }, body: '{}' }).body).email}"
- evalScript: "${output.memberB = json(http.post(E2E_API_URL + '/api/e2e/create-session?name=Tom%20Baker&email=tom%40flatsby.test', { headers: { 'x-vercel-protection-bypass': output.bypass }, body: '{}' }).body).email}"
- tapOn:
    id: "shopping-lists-group-settings"
- extendedWaitUntil:
    visible:
      id: "group-settings-members"
    timeout: 45000
- tapOn:
    id: "group-settings-members"
- extendedWaitUntil:
    visible:
      id: "group-add-member-email"
    timeout: 45000
- tapOn:
    id: "group-add-member-email"
- inputText: "${output.memberA}"
# Tap a neutral text to dismiss the keyboard (hideKeyboard is flaky on iOS)
- tapOn: "Manage Members"
- tapOn:
    id: "group-add-member-button"
# Member rows merge into one accessibility element, so their names never
# match; the count header's dynamic testID is the reliable success signal.
- extendedWaitUntil:
    visible:
      id: "group-members-count-2"
    timeout: 45000
- tapOn:
    id: "group-add-member-email"
- inputText: "${output.memberB}"
- tapOn: "Manage Members"
- tapOn:
    id: "group-add-member-button"
- extendedWaitUntil:
    visible:
      id: "group-members-count-3"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/05-add-member

# Back to the group's Home tab.
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible:
      id: "shopping-list-create-button"
    timeout: 45000

# Create the shopping list now (its card should appear in the Home
# screenshot) but stay out of it until the end. Inlined rather than via the
# create-shopping-list subflow, which would re-select the fixture group.
- tapOn:
    id: "shopping-list-create-button"
- extendedWaitUntil:
    visible:
      id: "shopping-list-create-input"
    timeout: 45000
- tapOn:
    id: "shopping-list-create-input"
- inputText: "Groceries"
- tapOn:
    id: "shopping-list-create-submit"
# The create mutation can fail transiently; the app rolls the optimistic card
# back and alerts. Tolerate one silent miss, dismiss the alert, and redo.
- extendedWaitUntil:
    visible:
      id: "shopping-list-dashboard-link"
    timeout: 45000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "shopping-list-dashboard-link"
    commands:
      - runFlow:
          when:
            visible: "OK"
          commands:
            - tapOn: "OK"
      - tapOn:
          id: "shopping-list-create-button"
      - extendedWaitUntil:
          visible:
            id: "shopping-list-create-input"
          timeout: 45000
      - tapOn:
          id: "shopping-list-create-input"
      - inputText: "Groceries"
      - tapOn:
          id: "shopping-list-create-submit"
- extendedWaitUntil:
    visible:
      id: "shopping-list-dashboard-link"
    timeout: 45000

# Seed expenses. Descriptions must stay unique on screen — later waits match
# them by full text ("Weekly shopping").
- tapOn:
    id: "tab-expenses"
- extendedWaitUntil:
    visible:
      id: "expense-heading"
    timeout: 45000
# First expense inline instead of via the subflow, so Step 2 — the split
# across all three members — can be captured mid-form.
- tapOn:
    id: "expense-add-button"
- extendedWaitUntil:
    visible:
      id: "expense-form-amount"
    timeout: 45000
- tapOn:
    id: "expense-form-amount"
- inputText: "84.20"
- tapOn:
    id: "expense-form-description"
- inputText: "Weekly shopping"
- tapOn: "Amount & Details"
- tapOn:
    id: "expense-form-category"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "picker-item-groceries"
    timeout: 20000
- tapOn:
    id: "picker-item-groceries"
- waitForAnimationToEnd
- tapOn:
    id: "expense-form-next"
- extendedWaitUntil:
    visible: "Step 2 of 3"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/04-expense-split
- tapOn:
    id: "expense-form-next"
- extendedWaitUntil:
    visible: "Step 3 of 3"
    timeout: 45000
- tapOn:
    id: "expense-form-submit"
- extendedWaitUntil:
    visible: "Weekly shopping"
    timeout: 20000
- runFlow:
    file: ../subflows/create-expense.yaml
    env:
      AMOUNT: "39.99"
      DESCRIPTION: "Internet bill"
      CATEGORY: "internet"
- runFlow:
    file: ../subflows/create-expense.yaml
    env:
      AMOUNT: "18.50"
      DESCRIPTION: "Cleaning supplies"
      CATEGORY: "home-goods"
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/03-expenses

# Back to Home, then into the list; the Home screenshot happens at the end,
# once the list is populated.
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible: "Sunset Villa"
    timeout: 45000

# Into the seeded list. The "Shopping lists" card only exists on the group
# dashboard variant; on the lists overview the link is directly visible.
- runFlow:
    when:
      visible: "Shopping lists"
    commands:
      - tapOn: "Shopping lists"
- extendedWaitUntil:
    visible:
      id: "shopping-list-dashboard-link"
    timeout: 45000
- tapOn:
    id: "shopping-list-dashboard-link"
- extendedWaitUntil:
    visible:
      id: "shopping-list-item-input"
    timeout: 45000

# Seed items with categories so the list looks lived-in.
- tapOn:
    id: "shopping-list-item-input"
- inputText: "Apples"
- tapOn:
    id: "shopping-list-category-picker"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "picker-item-produce"
    timeout: 20000
- tapOn:
    id: "picker-item-produce"
- tapOn:
    id: "shopping-list-add-item-button"
- extendedWaitUntil:
    visible: "Apples"
    timeout: 45000

- tapOn:
    id: "shopping-list-item-input"
- inputText: "Oat Milk"
- tapOn:
    id: "shopping-list-category-picker"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "picker-item-dairy"
    timeout: 20000
- tapOn:
    id: "picker-item-dairy"
- tapOn:
    id: "shopping-list-add-item-button"
- extendedWaitUntil:
    visible: "Oat Milk"
    timeout: 45000

- tapOn:
    id: "shopping-list-item-input"
- inputText: "Sourdough Bread"
- tapOn:
    id: "shopping-list-category-picker"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "picker-item-bakery"
    timeout: 20000
- tapOn:
    id: "picker-item-bakery"
- tapOn:
    id: "shopping-list-add-item-button"
- extendedWaitUntil:
    visible: "Sourdough Bread"
    timeout: 45000

- tapOn:
    id: "shopping-list-item-input"
- inputText: "Paper Towels"
- tapOn:
    id: "shopping-list-add-item-button"
- extendedWaitUntil:
    visible: "Paper Towels"
    timeout: 45000

# Dismiss the item-entry keyboard. iOS: keyboardDismissMode="on-drag"
# (ShoppingList.tsx), since hideKeyboard is flaky there and the item-detail
# modal is invisible to Maestro's hierarchy. Android: the drag doesn't
# dismiss and the keyboard survives tab switches, but hideKeyboard works.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "50%, 45%"
          end: "50%, 25%"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/02-shopping-list

# Home tab again, now showing the populated list card. The card's item
# count is cached from the pre-seeding visit, so pull-to-refresh
# (RefreshControl in ShoppingListsDashboard) before capturing.
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible: "Sunset Villa"
    timeout: 45000
- retry:
    maxRetries: 2
    commands:
      - swipe:
          start: "50%, 30%"
          end: "50%, 80%"
      - extendedWaitUntil:
          visible: "4 items left"
          timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/06-shopping-lists

# Pop back to the Home root: the stats dashboard (the overview is pushed on
# top of it). Then pull-to-refresh so the stats include the seeded data.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "1%, 50%"
          end: "70%, 50%"
# The hardware back key is swallowed here; the header's standard
# "Navigate up" button pops reliably.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Navigate up"
- extendedWaitUntil:
    visible:
      id: "dashboard-group-picker"
    timeout: 45000
- retry:
    maxRetries: 2
    commands:
      - swipe:
          start: "50%, 40%"
          end: "50%, 85%"
      - extendedWaitUntil:
          visible: "€142.69"
          timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/01-home
