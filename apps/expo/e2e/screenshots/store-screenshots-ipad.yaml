appId: ${APP_ID}
---
# iPad store screenshots: the same seven screens as the phone flow, captured on
# a 13" iPad Pro so the listing carries a full tablet set (App Store review
# also requires at least one APP_IPAD_PRO_3GEN_129 shot). Content is seeded
# server-side by create-session (`seed=store`), so this flow only logs in,
# navigates, and captures — see store-screenshots.yaml for why mutations were
# removed. The tablet layout differs (expenses render as a split view), but
# every element is reached by the same testIDs.
- runScript: store-strings.js
- runFlow:
    file: ../subflows/e2e-login.yaml
    env:
      E2E_USER_NAME: "Alex Rivera"
      E2E_USER_EMAIL: "alex@flatsby.test"
      E2E_SEED: "store"

- extendedWaitUntil:
    visible:
      id: "group-card-name"
      text: ${output.store.group}
    timeout: 45000

# Into the group, then the List tab, which opens the seeded list with its
# categorised items.
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TARGET_ID: "group-select-button"
      MARKER_ID: "dashboard-group-picker"
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-shopping-list"
      TAB_LABEL: ${output.store.tabShopping}
      TAB_X: "39%"
      MARKER_ID: "shopping-list-item-input"
- extendedWaitUntil:
    visible:
      id: "shopping-list-item-checkbox-${output.store.apples}"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "shopping-list-item-checkbox-${output.store.paperTowels}"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/ipad-02-shopping-list

# The list switcher over the list; picking the open list closes it again.
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TARGET_ID: "shopping-list-title"
      MARKER_ID: "list-switcher"
- extendedWaitUntil:
    visible: ${output.store.itemsLeft}
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/ipad-06-shopping-lists
- tapOn:
    id: "list-switcher-item-.*"
- extendedWaitUntil:
    notVisible:
      id: "list-switcher"
    timeout: 20000

# Expenses. On a tablet this is a split view: the list on the left, a detail
# panel on the right, with the add button in the header rather than a FAB —
# same testIDs either way.
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-expenses"
      TAB_LABEL: ${output.store.tabExpenses}
      TAB_X: "49%"
      MARKER_ID: "expense-heading"
- extendedWaitUntil:
    visible:
      id: "expense-card-${output.store.weeklyShopping}"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "expense-card-${output.store.cleaningSupplies}"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/ipad-03-expenses

# The split step of the expense form, captured mid-flight and backed out of
# without submitting.
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TARGET_ID: "expense-add-button"
      MARKER_ID: "expense-form-amount"
- tapOn:
    id: "expense-form-amount"
- inputText: "64.30"
- tapOn:
    id: "expense-form-description"
- inputText: ${output.store.description}
# Tap a neutral heading to dismiss the keyboard (hideKeyboard is flaky on iOS)
- tapOn: ${output.store.amountHeading}
- waitForAnimationToEnd
- tapOn:
    id: "expense-form-category"
- waitForAnimationToEnd
# The picker sheet is virtualized: only the top rows exist in the hierarchy,
# so pick from the visible first group.
- extendedWaitUntil:
    visible:
      id: "picker-item-groceries"
    timeout: 20000
- tapOn:
    id: "picker-item-groceries"
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: "expense-form-next"
          commands:
            - tapOn:
                id: "expense-form-next"
      - extendedWaitUntil:
          visible:
            id: "split-details-card"
          timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/ipad-04-expense-split

- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: "expense-form-back"
          commands:
            - tapOn:
                id: "expense-form-back"
      - extendedWaitUntil:
          visible:
            id: "expense-form-amount"
          timeout: 15000
# Step 1 has no footer back button; the navigation header's does the job.
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TARGET_ID: "BackButton"
      MARKER_ID: "expense-heading"

# "01a": see the calendar step in store-screenshots.yaml.
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-calendar"
      TAB_LABEL: ${output.store.tabCalendar}
      TAB_X: "59%"
      MARKER_ID: "calendar-heading"
- extendedWaitUntil:
    visible:
      id: "calendar-day-progress"
      text: "1 .* 3 .*"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/ipad-01a-calendar

# Members screen, through the home's group-settings button.
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-home"
      TAB_LABEL: ${output.store.tabHome}
      TAB_X: "30%"
      MARKER_ID: "dashboard-group-settings"
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TARGET_ID: "dashboard-group-settings"
      MARKER_ID: "group-settings-members"
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TARGET_ID: "group-settings-members"
      MARKER_ID: "group-invite-button"
- extendedWaitUntil:
    visible:
      id: "group-members-count-3"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/ipad-05-add-member

# Home root: the stats dashboard with the seeded totals.
- runFlow:
    file: ../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-home"
      TAB_LABEL: ${output.store.tabHome}
      TAB_X: "30%"
      MARKER_ID: "dashboard-group-picker"
- extendedWaitUntil:
    visible:
      id: "dashboard-group-picker"
    timeout: 45000
# Store screenshots show the classic home without the invite to the new one
- runFlow:
    when:
      visible:
        id: "home-invite-dismiss"
    commands:
      - tapOn:
          id: "home-invite-dismiss"
- retry:
    maxRetries: 2
    commands:
      - swipe:
          start: "50%, 40%"
          end: "50%, 85%"
      - extendedWaitUntil:
          visible: ".*142.69.*"
          timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/${output.locale}/ipad-01-home
