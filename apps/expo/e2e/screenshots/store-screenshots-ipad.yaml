appId: ${APP_ID}
---
# iPad store screenshots: App Store review requires at least one 13" iPad
# capture (APP_IPAD_PRO_3GEN_129). Same server-side seeding as the phone
# flow — login, navigate, capture; no mutations. Deliberately minimal: the
# tablet layout differs from the phone's, and review needs only the two
# shots.
- runFlow:
    file: ../subflows/e2e-login.yaml
    env:
      E2E_USER_NAME: "Alex Rivera"
      E2E_USER_EMAIL: "alex@flatsby.test"
      E2E_SEED: "store"

- extendedWaitUntil:
    visible:
      id: "group-card-name"
      text: "Sunset Villa"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/ipad-02-groups

- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TARGET_ID: "group-select-button"
      MARKER_ID: "shopping-list-create-button"
- extendedWaitUntil:
    visible:
      id: "shopping-lists-group-name"
      text: "Sunset Villa"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "shopping-list-dashboard-link"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: e2e/results/screenshots/ipad-01-shopping-lists
