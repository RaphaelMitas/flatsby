appId: ${APP_ID}
tags:
  - auth
---
# Mirrors the sign-up test in apps/nextjs/e2e/auth/email-code.spec.ts
- runFlow:
    file: ../../subflows/e2e-login.yaml
    env:
      E2E_SIGNED_OUT: "1"
- evalScript: "${output.codeEmail = 'code-' + Date.now() + '-' + Math.floor(Math.random() * 1e6) + '@flatsby.test'}"
- tapOn:
    id: "sign-in-email-input"
- inputText: ${output.codeEmail}
# The email button stays above the keyboard, and hideKeyboard can't dismiss it on iOS here
- tapOn:
    id: "sign-in-email-button"
- extendedWaitUntil:
    visible:
      id: "code-screen"
    timeout: 30000
- runScript:
    file: sign-in-code.js
    env:
      EMAIL: ${output.codeEmail}
- evalScript: "${output.wrongCode = output.signInCode === '000000' ? '111111' : '000000'}"
- tapOn:
    id: "code-input"
- inputText: ${output.wrongCode}
- extendedWaitUntil:
    visible:
      id: "code-error"
    timeout: 15000
- inputText: ${output.signInCode}
# A sign-up goes straight to onboarding, the passkey offer waits for the next code sign-in
- extendedWaitUntil:
    visible:
      id: "onboarding-title"
    timeout: 30000
# An error leaves as soon as its field changes, the group name follows the name
- tapOn:
    id: "onboarding-create"
- assertVisible: "User name cannot be empty"
- assertVisible: "Group name is required"
- tapOn:
    id: "onboarding-name-input"
- inputText: "Code User"
- assertNotVisible: "User name cannot be empty"
- assertNotVisible: "Group name is required"
- tapOn:
    id: "onboarding-flatmates-input"
- inputText: "Lena"
- tapOn:
    id: "onboarding-flatmate-add"
- inputText: "Tim"
# Return adds Tim and keeps the keyboard; on the empty field it closes it, uncovering the button
- pressKey: Enter
- pressKey: Enter
- tapOn:
    id: "onboarding-create"
# The create button stays busy until the invite is cached, so the card opens complete
- extendedWaitUntil:
    visible:
      id: "invite-flatmates-card"
    timeout: 30000
- assertVisible:
    id: "invite-card-code"
- assertVisible: "Lena"
- assertVisible: "Tim"
- openLink: flatsby://settings/passkeys
- extendedWaitUntil:
    visible:
      id: "passkeys-empty"
    timeout: 30000
