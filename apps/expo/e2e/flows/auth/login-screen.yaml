appId: ${APP_ID}
tags:
  - auth
---
# Mirrors apps/nextjs/e2e/auth/login.spec.ts:
# login screen renders the email field, OAuth buttons, tagline, and legal links.
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 60000
- assertVisible:
    id: "sign-in-email-input"
- assertVisible:
    id: "sign-in-google-button"
- assertVisible:
    id: "sign-in-apple-button"
# A device that never used a passkey only gets the small link
- assertVisible:
    id: "sign-in-passkey-link"
- assertNotVisible:
    id: "sign-in-passkey-button"
- assertVisible: "Manage your daily life with your flatmates."
# The Terms/Privacy links are nested Text nodes, exposed as one combined string
- assertVisible: ".*Terms.*Privacy Policy.*"
- assertVisible: "Legal Notice"
