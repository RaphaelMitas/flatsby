appId: com.flatcove.app.v2
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn:
    text: "Cancel"
    optional: true
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 60000
- openLink: "flatsby://e2e-login?apiUrl=${E2E_API_URL}&bypass=${VERCEL_BYPASS_SECRET}"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "e2e-bootstrap-done"
    timeout: 60000
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 60000
