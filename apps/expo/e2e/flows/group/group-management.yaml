appId: ${APP_ID}
tags:
  - group
---
# Mirrors apps/nextjs/e2e/group/group-management.spec.ts:
# create group via UI, change group name, switch groups from home.
- runFlow: ../../subflows/e2e-login.yaml

# Create a group via the UI
- runFlow:
    file: ../../subflows/create-group.yaml
    env:
      GROUP_NAME: "Maestro Group"

# Change group name via group settings
- tapOn:
    id: "dashboard-group-settings"
- extendedWaitUntil:
    visible:
      id: "group-settings-details"
    timeout: 15000
- tapOn:
    id: "group-settings-details"
- extendedWaitUntil:
    visible:
      id: "group-name-input"
    timeout: 15000
- tapOn:
    id: "group-name-input"
- eraseText
- inputText: "Maestro Group Updated"
- tapOn: "Group Name"
- tapOn:
    id: "group-name-save"
- extendedWaitUntil:
    visible:
      id: "group-name-input"
      text: "Maestro Group Updated"
    timeout: 15000

# Switch back to the fixture group from the home's group switcher
- runFlow:
    file: ../../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-home"
      TAB_LABEL: "Home"
      TAB_X: "10%"
      MARKER_ID: "dashboard-group-picker"
- tapOn:
    id: "dashboard-group-picker"
- extendedWaitUntil:
    visible:
      id: "group-switcher"
    timeout: 15000
- tapOn: "E2E Test Group.*"
- extendedWaitUntil:
    notVisible:
      id: "group-switcher"
    timeout: 15000
- assertVisible: "E2E Test Group.*"
- assertNotVisible: "Maestro Group Updated"
