appId: com.flatcove.app.v2
env:
  GROUP_NAME: ${'E2E Group ' + Date.now()}
  LIST_NAME: ${'E2E List ' + Date.now()}
  ITEM_NAME: "Milk"
---
# Test: Create group, then create shopping list, then add an item
# Full integration flow matching Next.js e2e coverage
- runFlow: ../../subflows/launch-fresh.yaml
- runFlow: ../../subflows/e2e-login.yaml
- extendedWaitUntil:
    visible:
      id: "groups-create-group-button"
- tapOn:
    id: "groups-create-group-button"
- extendedWaitUntil:
    visible:
      id: "create-group-name-input"
- runFlow:
    file: ../../subflows/fill-input.yaml
    env:
      INPUT_ID: create-group-name-input
      TEXT: ${GROUP_NAME}
- tapOn:
    id: "create-group-submit-button"
- extendedWaitUntil:
    visible:
      text: "${GROUP_NAME}"
- assertVisible:
    text: "${GROUP_NAME}"

# Select the group
- tapOn:
    text: "Select Group"
    rightOf:
      text: "${GROUP_NAME}"
- extendedWaitUntil:
    visible:
      id: "shopping-lists-create-button"
- assertVisible:
    id: "shopping-lists-create-button"

# Create a shopping list
- tapOn:
    id: "shopping-lists-create-button"
- extendedWaitUntil:
    visible:
      id: "create-shopping-list-name-input"
- assertVisible:
    id: "create-shopping-list-name-input"
- runFlow:
    file: ../../subflows/fill-input.yaml
    env:
      INPUT_ID: create-shopping-list-name-input
      TEXT: ${LIST_NAME}
- tapOn:
    id: "create-shopping-list-submit-button"
- extendedWaitUntil:
    visible:
      text: "${LIST_NAME}, 0 items left"
    timeout: 30000
- assertVisible:
    text: "${LIST_NAME}, 0 items left"

# Select the shopping list
- tapOn:
    text: "${LIST_NAME}, 0 items left"
- extendedWaitUntil:
    visible:
      id: "shopping-list-add-input"
- assertVisible:
    id: "shopping-list-add-input"

# Add an item
- runFlow:
    file: ../../subflows/fill-input.yaml
    env:
      INPUT_ID: shopping-list-add-input
      TEXT: ${ITEM_NAME}
- tapOn:
    id: "shopping-list-add-button"
- extendedWaitUntil:
    visible:
      text: "${ITEM_NAME}"
- assertVisible:
    text: "${ITEM_NAME}"
