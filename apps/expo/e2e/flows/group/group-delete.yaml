appId: ${APP_ID}
tags:
  - group
---
# Mirrors "delete group" + "deleted group inaccessible" from
# apps/nextjs/e2e/group/group-management.spec.ts.
- runFlow: ../../subflows/e2e-login.yaml

# Create a group we can safely delete (known name for the confirmation input)
- tapOn:
    id: "group-create-button"
- extendedWaitUntil:
    visible:
      id: "group-create-name-input"
    timeout: 15000
- tapOn:
    id: "group-create-name-input"
- inputText: "Delete Me Group"
- tapOn:
    id: "group-create-submit"
- extendedWaitUntil:
    visible: "Delete Me Group"
    timeout: 15000

# Swipe left on the dashboard row to reveal Delete, confirm with typed name
- swipe:
    from:
      text: "Delete Me Group"
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: "delete-confirmation-input"
    timeout: 15000
- tapOn:
    id: "delete-confirmation-input"
- inputText: "Delete Me Group"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "delete-confirmation-input"
      text: "Delete Me Group"
    timeout: 5000
# Dismiss the keyboard (tapping the modal body dismisses it), then confirm
- tapOn: "Confirmation Required"
- waitForAnimationToEnd
- assertVisible:
    id: "delete-confirmation-confirm"
    enabled: true
# The confirm tap sometimes doesn't register on hosted runners.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: "delete-confirmation-confirm"
          commands:
            - tapOn:
                id: "delete-confirmation-confirm"
      - extendedWaitUntil:
          notVisible:
            id: "delete-confirmation-confirm"
          timeout: 20000

# The deleted group is gone from the dashboard
- extendedWaitUntil:
    notVisible: "Delete Me Group"
    timeout: 15000
- assertVisible:
    id: "group-dashboard-title"

# A group with an expense must delete too, here through group settings
- tapOn:
    id: "group-create-button"
- extendedWaitUntil:
    visible:
      id: "group-create-name-input"
    timeout: 15000
- tapOn:
    id: "group-create-name-input"
- inputText: "Spent Group"
- tapOn:
    id: "group-create-submit"
- extendedWaitUntil:
    visible: "Spent Group"
    timeout: 15000
- tapOn:
    id: "group-select-button"
    index: 1
- extendedWaitUntil:
    visible:
      id: "shopping-lists-group-settings"
    timeout: 15000
- runFlow:
    file: ../../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-expenses"
      TAB_LABEL: "Expenses"
      TAB_X: "62%"
- extendedWaitUntil:
    visible:
      id: "expense-heading"
    timeout: 15000
- runFlow:
    file: ../../subflows/create-expense.yaml
    env:
      AMOUNT: "25.00"
      DESCRIPTION: "Before Delete"
- runFlow:
    file: ../../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-home"
      TAB_LABEL: "Home"
      TAB_X: "41%"
- runFlow:
    file: ../../subflows/tap-until.yaml
    env:
      TARGET_ID: "shopping-lists-group-settings"
      MARKER_ID: "group-settings-details"
- scrollUntilVisible:
    element:
      id: "group-settings-delete"
    direction: DOWN
- tapOn:
    id: "group-settings-delete"
- extendedWaitUntil:
    visible:
      id: "delete-confirmation-input"
    timeout: 15000
- tapOn:
    id: "delete-confirmation-input"
- inputText: "Spent Group"
- waitForAnimationToEnd
- tapOn: "Confirmation Required"
- waitForAnimationToEnd
- tapOn:
    id: "delete-confirmation-confirm"
- extendedWaitUntil:
    notVisible:
      id: "delete-confirmation-confirm"
    timeout: 20000

# The list hides the group optimistically, so relaunch to read what the server kept
- launchApp
- extendedWaitUntil:
    visible: "E2E Test Group.*"
    timeout: 30000
- assertNotVisible: "Spent Group"
