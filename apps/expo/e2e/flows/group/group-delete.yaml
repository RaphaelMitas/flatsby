appId: ${APP_ID}
tags:
  - group
---
# Mirrors "delete group", "deleted group inaccessible" and "delete group with
# expenses" from apps/nextjs/e2e/group/group-management.spec.ts.
- runFlow: ../../subflows/e2e-login.yaml

- runFlow:
    file: ../../subflows/create-group.yaml
    env:
      GROUP_NAME: "Delete Me Group"
# Creating selected the group, so reach the group list through its settings
- tapOn:
    id: "dashboard-group-settings"
- extendedWaitUntil:
    visible:
      id: "group-settings-change-group"
    timeout: 15000
- tapOn:
    id: "group-settings-change-group"
- extendedWaitUntil:
    visible:
      id: "group-dashboard-title"
    timeout: 15000
- swipe:
    from:
      text: "Delete Me Group"
    direction: LEFT
- runFlow:
    file: ../../subflows/confirm-delete.yaml
    env:
      CONFIRM_TEXT: "Delete Me Group"
- extendedWaitUntil:
    notVisible: "Delete Me Group"
    timeout: 15000
- assertVisible:
    id: "group-dashboard-title"

# A group with an expense must delete too, here through group settings
- runFlow:
    file: ../../subflows/create-group.yaml
    env:
      GROUP_NAME: "Spent Group"
- runFlow:
    file: ../../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-expenses"
      TAB_LABEL: "Expenses"
      TAB_X: "62%"
      MARKER_ID: "expense-heading"
- runFlow:
    file: ../../subflows/create-expense.yaml
    env:
      AMOUNT: "25.00"
      DESCRIPTION: "Before Delete"
- runFlow:
    file: ../../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-home"
      TAB_LABEL: "Home"
      TAB_X: "41%"
      MARKER_ID: "dashboard-group-settings"
- runFlow:
    file: ../../subflows/tap-until.yaml
    env:
      TARGET_ID: "dashboard-group-settings"
      MARKER_ID: "group-settings-details"
# Centered, or the tap can land on the iOS tab bar floating over the row
- scrollUntilVisible:
    element:
      id: "group-settings-delete"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "group-settings-delete"
- runFlow:
    file: ../../subflows/confirm-delete.yaml
    env:
      CONFIRM_TEXT: "Spent Group"

# Lands on Home's group list, which hides the group optimistically. Once it shows,
# the delete has left the app, so relaunch to read what the server kept.
- extendedWaitUntil:
    visible:
      id: "group-dashboard-title"
    timeout: 15000
- runFlow:
    file: ../../subflows/relaunch.yaml
    env:
      MARKER_ID: "group-dashboard-title"
- extendedWaitUntil:
    visible: "E2E Test Group.*"
    timeout: 30000
- assertNotVisible: "Spent Group"
