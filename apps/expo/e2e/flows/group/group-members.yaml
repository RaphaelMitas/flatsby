appId: ${APP_ID}
tags:
  - group
---
- runFlow: ../../subflows/e2e-login.yaml

# Select the fixture group to enter it
- tapOn:
    id: "group-select-button"
- extendedWaitUntil:
    visible:
      id: "dashboard-group-picker"
    timeout: 15000

# Open group settings -> members -> invite
- tapOn:
    id: "dashboard-group-settings"
- extendedWaitUntil:
    visible:
      id: "group-settings-members"
    timeout: 15000
- tapOn:
    id: "group-settings-members"
- extendedWaitUntil:
    visible:
      id: "group-invite-button"
    timeout: 15000

# Anna has no account yet; the second user claims her spot below
- scrollUntilVisible:
    element:
      id: "placeholder-name-input"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "placeholder-name-input"
- inputText: "Anna"
- tapOn:
    id: "placeholder-add-button"
# The optimistic row stays disabled until the server returns its id
- extendedWaitUntil:
    visible:
      id: "placeholder-row-Anna"
      enabled: true
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "group-invite-button"
    direction: UP
- tapOn:
    id: "group-invite-button"
- extendedWaitUntil:
    visible:
      id: "group-invite-code"
    timeout: 15000
- copyTextFrom:
    id: "group-invite-code"
# e2e-login below overwrites maestro.copiedText
- evalScript: ${output.inviteCode = maestro.copiedText}

# The admin is already a member, so the preview offers "Open group", not join.
- openLink: flatsby://join/${output.inviteCode}
- runFlow:
    when:
      visible: "Open in .*Flatsby.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "join-invite-group-name"
    timeout: 15000
- assertVisible: "Open group"

# e2e-login mints a fresh user, who joins by typing the copied code
- runFlow: ../../subflows/e2e-login.yaml
- tapOn:
    id: "group-join-with-code-button"
- extendedWaitUntil:
    visible:
      id: "group-join-code-submit"
    timeout: 15000
- inputText: ${output.inviteCode}
- tapOn:
    id: "group-join-code-submit"
- extendedWaitUntil:
    visible:
      id: "join-invite-button"
    timeout: 15000
# Joining as new is preselected; picking Anna renames the button
- assertVisible:
    id: "join-claim-new"
- tapOn:
    id: "join-claim-option-.*"
- assertVisible:
    id: "join-invite-button"
    text: "Join as Anna"
- tapOn:
    id: "join-invite-button"
- extendedWaitUntil:
    visible:
      id: "dashboard-group-picker"
    timeout: 20000

# The claim took over Anna's row: two members, and Anna is no longer pending
- tapOn:
    id: "dashboard-group-settings"
- extendedWaitUntil:
    visible:
      id: "group-settings-members"
    timeout: 15000
- tapOn:
    id: "group-settings-members"
- extendedWaitUntil:
    visible:
      id: "group-members-count-2"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "placeholder-name-input"
    direction: DOWN
- assertNotVisible:
    id: "placeholder-row-Anna"
