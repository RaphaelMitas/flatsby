appId: ${APP_ID}
tags:
  - group
---
# Mirrors the invite tests in apps/nextjs/e2e/group/group-management.spec.ts.
# The second-user join only runs on web: one device can't hold two sessions.
- runFlow: ../../subflows/e2e-login.yaml

# Select the fixture group to enter it
- tapOn:
    id: "group-select-button"
- extendedWaitUntil:
    visible:
      id: "shopping-list-create-button"
    timeout: 15000

# Open group settings -> members -> invite
- tapOn:
    id: "shopping-lists-group-settings"
- extendedWaitUntil:
    visible:
      id: "group-settings-members"
    timeout: 15000
- tapOn:
    id: "group-settings-members"
- extendedWaitUntil:
    visible:
      id: "group-invite-button"
    timeout: 15000
- tapOn:
    id: "group-invite-button"
- extendedWaitUntil:
    visible:
      id: "group-invite-code"
    timeout: 15000
- copyTextFrom:
    id: "group-invite-code"

# The dashed code from the sheet opens the invite preview; the admin is
# already a member, so it offers to open the group instead of joining.
- openLink: flatsby://join/${maestro.copiedText}
- runFlow:
    when:
      visible: "Open in .*Flatsby.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "join-invite-group-name"
    timeout: 15000
- assertVisible: "Open group"
