appId: com.flatcove.app.v2
env:
  GROUP_NAME: ${'E2E Group ' + Date.now()}
---
# Test: Create a group via UI
# Matches Next.js group-management.spec.ts "create group via UI"
- runFlow: ../../subflows/launch-fresh.yaml
- runFlow: ../../subflows/e2e-login.yaml
- extendedWaitUntil:
    visible:
      id: "groups-create-group-button"
- assertVisible:
    id: "groups-create-group-button"
- tapOn:
    id: "groups-create-group-button"
- extendedWaitUntil:
    visible:
      id: "create-group-name-input"
- assertVisible:
    id: "create-group-name-input"
- runFlow:
    file: ../../subflows/fill-input.yaml
    env:
      INPUT_ID: create-group-name-input
      TEXT: ${GROUP_NAME}
- tapOn:
    id: "create-group-submit-button"
- extendedWaitUntil:
    visible:
      text: "${GROUP_NAME}"
- assertVisible:
    text: "${GROUP_NAME}"
