appId: com.flatcove.app.v2
env:
  GROUP_NAME: "E2E Group ${timestamp}"
  DESCRIPTION: "Groceries"
  AMOUNT: "25.00"
---
# Test: Create an expense with equal split
# Matches Next.js expense-creation.spec.ts
- runFlow: ../../subflows/launch-fresh.yaml
- runFlow: ../../subflows/e2e-login.yaml
- extendedWaitUntil:
    visible:
      id: "groups-create-group-button"
- tapOn:
    id: "groups-create-group-button"
- extendedWaitUntil:
    visible:
      id: "create-group-name-input"
- inputText:
    id: "create-group-name-input"
    text: "${GROUP_NAME}"
- tapOn:
    id: "create-group-submit-button"
- extendedWaitUntil:
    visible:
      text: "${GROUP_NAME}"

# Navigate to expenses via dashboard
- tapOn:
    text: "Expenses"
- extendedWaitUntil:
    visible:
      text: "Expenses"
- assertVisible:
    text: "Expenses"

# Tap the FAB to add expense
- tapOn:
    id: "expenses-add-fab"
- extendedWaitUntil:
    visible:
      id: "expense-form-step-indicator"
- assertVisible:
    id: "expense-form-step-indicator"

# Fill amount
- tapOn:
    id: "expense-form-amount-input"
- inputText:
    text: "${AMOUNT}"
- tapOn:
    point: "50p, 50p"
- tapOn:
    id: "expense-form-description-input"
- inputText:
    text: "${DESCRIPTION}"
- tapOn:
    point: "50p, 50p"

# Go to next step (splits)
- tapOn:
    id: "expense-form-next-button"
- extendedWaitUntil:
    visible:
      text: "Step 2 of 3"
- assertVisible:
    text: "Step 2 of 3"

# Go to review step
- tapOn:
    id: "expense-form-next-button"
- extendedWaitUntil:
    visible:
      text: "Step 3 of 3"
- assertVisible:
    text: "Step 3 of 3"

# Submit
- tapOn:
    id: "expense-form-submit-button"
- extendedWaitUntil:
    visible:
      text: "Expenses"
- assertVisible:
    text: "${DESCRIPTION}"
