appId: com.flatcove.app.v2
env:
  GROUP_NAME: ${'E2E Group ' + Date.now()}
---
# Test: View debt summary page
# Matches Next.js debt-settlements.spec.ts "displays debt summary page"
- runFlow: ../../subflows/launch-fresh.yaml
- runFlow: ../../subflows/e2e-login.yaml
- extendedWaitUntil:
    visible:
      id: "groups-create-group-button"
- tapOn:
    id: "groups-create-group-button"
- extendedWaitUntil:
    visible:
      id: "create-group-name-input"
- runFlow:
    file: ../../subflows/fill-input.yaml
    env:
      INPUT_ID: create-group-name-input
      TEXT: ${GROUP_NAME}
- tapOn:
    id: "create-group-submit-button"
- extendedWaitUntil:
    visible:
      text: "${GROUP_NAME}"

# Navigate to expenses
- tapOn:
    text: "Expenses"
- extendedWaitUntil:
    visible:
      id: "expenses-debt-overview-button"
- tapOn:
    id: "expenses-debt-overview-button"
- extendedWaitUntil:
    visible:
      id: "debts-title"
- assertVisible:
    id: "debts-title"
- assertVisible:
    text: "Simplified view of who owes whom"

# With no expenses, should show settled state
- assertVisible:
    text: "All settled up!"
