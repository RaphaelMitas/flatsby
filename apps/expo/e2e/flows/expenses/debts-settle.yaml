appId: ${APP_ID}
tags:
  - expenses
---
# Seeded group (E2E_SEED=debts): Max owes you EUR 42.50, Sophie EUR 18.00, you
# owe Lena EUR 30.00 and Max USD 15.00. Settling Sophie in full drops her row.
# Lena and Max added a PayPal.me name, Sophie and you didn't.
- runFlow:
    file: ../../subflows/e2e-login.yaml
    env:
      E2E_SEED: "debts"
- runFlow: ../../subflows/open-expenses.yaml

- extendedWaitUntil:
    visible:
      id: "expense-debt-card"
      text: ".*€30[.,]50.*"
    timeout: 15000
- tapOn:
    id: "expense-debt-card"
- extendedWaitUntil:
    visible:
      id: "debt-summary-title"
    timeout: 15000
- assertVisible:
    id: "debt-hero-amount"
    text: ".*€30[.,]50"
- assertVisible: "Settle up EUR with Max"
- assertVisible: "Settle up USD with Max"

- scrollUntilVisible:
    element: "€12[.,]00"
    direction: DOWN
- assertVisible: "Settle up: Max pays Lena"
- assertVisible: "€25[.,]00"
- assertVisible: "Settle up: Sophie pays Max"

- scrollUntilVisible:
    element:
      id: "debt-hero-amount"
    direction: UP
- tapOn:
    id: "debt-mode-simplified"
- assertVisible: "€55[.,]50"
- assertVisible: "€7[.,]50"
- assertNotVisible: "Settle up: Sophie pays Max"
- assertVisible:
    id: "debt-row-toggle"
    text: ".*pays you.*"
- assertVisible: "€30[.,]50"
- tapOn:
    id: "debt-mode-actual"

- tapOn: "Settle up EUR with Sophie"
- extendedWaitUntil:
    visible:
      id: "settlement-submit-button"
    timeout: 15000
- assertVisible: "Sophie owes you directly"
- assertVisible:
    id: "settlement-currency-locked"
- assertVisible:
    id: "settlement-submit-button"
    text: "Mark as paid"
- tapOn:
    id: "settlement-submit-button"

- extendedWaitUntil:
    visible:
      id: "debt-summary-title"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Settle up EUR with Sophie"
    timeout: 20000
- assertVisible:
    id: "debt-hero-amount"
    text: ".*€12[.,]50"
- assertVisible: "Settle up EUR with Max"

# The settle form is a KeyboardAwareScrollView, which Maestro's swipes don't
# reliably move on hosted simulators, so these steps stay above the fold.
- tapOn: "Settle up EUR with Lena"
- extendedWaitUntil:
    visible:
      id: "settle-paypal-button"
    timeout: 15000
- assertVisible:
    id: "settle-paypal-share"
- tapOn:
    id: "settlement-cancel-button"

- extendedWaitUntil:
    visible:
      id: "debt-summary-title"
    timeout: 15000
- tapOn: "Settle up USD with Max"
- extendedWaitUntil:
    visible:
      id: "settle-paypal-button"
    timeout: 15000
- tapOn:
    id: "settlement-cancel-button"
