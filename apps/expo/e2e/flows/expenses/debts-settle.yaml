appId: ${APP_ID}
tags:
  - expenses
---
# Seeded group (E2E_SEED=debts): Max owes you EUR 42.50, Sophie EUR 18.00, you
# owe Lena EUR 30.00 and Max USD 15.00. Settling Sophie in full drops her row.
# Lena and Max added an IBAN and a PayPal.me name, Sophie and you didn't.
- runFlow:
    file: ../../subflows/e2e-login.yaml
    env:
      E2E_SEED: "debts"
- runFlow: ../../subflows/open-expenses.yaml

- tapOn:
    id: "expense-debt-overview-button"
- extendedWaitUntil:
    visible:
      id: "debt-summary-title"
    timeout: 15000
- assertVisible:
    id: "debt-hero-amount"
    text: ".*€30[.,]50"
- assertVisible: "Record EUR payment with Max"
- assertVisible: "Record USD payment with Max"

- scrollUntilVisible:
    element: "€12[.,]00"
    direction: DOWN
- assertVisible: "Record Max paying Lena"
- assertVisible: "€25[.,]00"
- assertVisible: "Record Sophie paying Max"

- scrollUntilVisible:
    element:
      id: "debt-hero-amount"
    direction: UP
- tapOn:
    id: "debt-mode-simplified"
- assertVisible: "€55[.,]50"
- assertVisible: "€7[.,]50"
- assertNotVisible: "Record Sophie paying Max"
- assertVisible:
    id: "debt-row-toggle"
    text: ".*pays you.*"
- assertVisible: "€30[.,]50"
- tapOn:
    id: "debt-mode-actual"

- tapOn: "Record EUR payment with Sophie"
- extendedWaitUntil:
    visible:
      id: "settlement-submit-button"
    timeout: 15000
- assertVisible: "Sophie owes you directly"
- assertVisible:
    id: "settlement-currency-locked"
- tapOn:
    id: "settlement-submit-button"

- extendedWaitUntil:
    visible:
      id: "debt-summary-title"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Record EUR payment with Sophie"
    timeout: 20000
- assertVisible:
    id: "debt-hero-amount"
    text: ".*€12[.,]50"
- assertVisible: "Record EUR payment with Max"

# The settle form is a KeyboardAwareScrollView, which Maestro's swipes don't
# reliably move on hosted simulators, so these steps stay above the fold.
- tapOn: "Record EUR payment with Lena"
- extendedWaitUntil:
    visible:
      id: "settle-pay-iban"
    timeout: 15000
- assertVisible:
    id: "settle-pay-iban"
    text: "DE89 3704 0044 0532 0130 00"
- tapOn:
    id: "settle-pay-show-code"
- assertVisible:
    id: "settle-girocode"
- tapOn:
    id: "settle-pay-show-code"
- tapOn:
    id: "settle-pay-method-paypal"
- assertVisible:
    id: "settle-paypal-button"
- tapOn:
    id: "settlement-cancel-button"

# GiroCode only carries euro, so the USD debt with Max offers PayPal alone
- extendedWaitUntil:
    visible:
      id: "debt-summary-title"
    timeout: 15000
- tapOn: "Record USD payment with Max"
- extendedWaitUntil:
    visible:
      id: "settle-paypal-button"
    timeout: 15000
- assertNotVisible:
    id: "settle-pay-method-bank"
- assertNotVisible:
    id: "settle-girocode"
- tapOn:
    id: "settlement-cancel-button"
