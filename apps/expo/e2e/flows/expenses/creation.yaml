appId: ${APP_ID}
tags:
  - expenses
---
# Mirrors "creates an expense with equal split" and "manual category selection"
# from apps/nextjs/e2e/expenses/expense-creation.spec.ts.
- runFlow: ../../subflows/e2e-login.yaml
- runFlow: ../../subflows/open-expenses.yaml

# Empty state on a fresh group
- assertVisible: "No expenses yet"

# Create an equal-split expense with a manually selected category
- tapOn:
    id: "expense-add-button"
- extendedWaitUntil:
    visible:
      id: "expense-form-amount"
    timeout: 15000
- tapOn:
    id: "expense-form-amount"
- inputText: "25.00"
- tapOn:
    id: "expense-form-description"
- inputText: "Team snacks"
- tapOn: "Amount & Details"
- tapOn:
    id: "expense-form-category"
- waitForAnimationToEnd
- takeScreenshot: e2e/results/creation-category-sheet
- extendedWaitUntil:
    visible:
      id: "picker-item-restaurant"
    timeout: 20000
- tapOn:
    id: "picker-item-restaurant"
- tapOn:
    id: "expense-form-next"
- extendedWaitUntil:
    visible: "Step 2 of 3"
    timeout: 15000
- tapOn:
    id: "expense-form-next"
- extendedWaitUntil:
    visible: "Step 3 of 3"
    timeout: 15000
- assertVisible: ".*25[.,]00.*"
- tapOn:
    id: "expense-form-submit"

# Back on the list: the new expense is visible
- extendedWaitUntil:
    visible: "Team snacks"
    timeout: 20000
- assertVisible: ".*25[.,]00.*"

# A CHF expense converted to EUR by hand, so the test never depends on the fetched rate
- tapOn:
    id: "expense-add-button"
- extendedWaitUntil:
    visible:
      id: "expense-form-amount"
    timeout: 15000
# Description first: on Android, after the currency sheet closes, the first tap from one text field to another is dropped
- tapOn:
    id: "expense-form-description"
- inputText: "Zurich dinner"
- tapOn: "Amount & Details"
- tapOn:
    id: "expense-form-currency"
- extendedWaitUntil:
    visible:
      id: "picker-item-CHF"
    timeout: 20000
- tapOn:
    id: "picker-item-CHF"
- tapOn:
    id: "expense-form-amount"
- inputText: "10.00"
- tapOn: "Amount & Details"
- tapOn:
    id: "expense-form-convert"
- extendedWaitUntil:
    visible:
      id: "expense-form-converted-amount"
    timeout: 10000
- tapOn:
    id: "expense-form-converted-amount"
- eraseText
- inputText: "9.00"
- tapOn: "Amount & Details"
- tapOn:
    id: "expense-form-next"
- extendedWaitUntil:
    visible: "Step 2 of 3"
    timeout: 15000
- tapOn:
    id: "expense-form-next"
- extendedWaitUntil:
    visible: "Step 3 of 3"
    timeout: 15000
- tapOn:
    id: "expense-form-submit"
- extendedWaitUntil:
    visible: "Zurich dinner"
    timeout: 20000
- assertVisible: "€9[.,]00"
- assertVisible: "CHF.10[.,]00"

# Receipt scan: the entry and its source sheet. Picking a photo runs in the system
# picker, which the web suite stands in for (same hook, fixed e2e receipt).
- tapOn:
    id: "expense-add-button"
- extendedWaitUntil:
    visible:
      id: "receipt-scan"
    timeout: 15000
- tapOn:
    id: "receipt-scan"
- extendedWaitUntil:
    visible:
      id: "receipt-scan-library"
    timeout: 10000
- assertVisible:
    id: "receipt-scan-camera"
