appId: ${APP_ID}
tags:
  - expenses
---
# Mirrors "creates an expense with equal split" and "manual category selection"
# from apps/nextjs/e2e/expenses/expense-creation.spec.ts.
- runFlow: ../../subflows/e2e-login.yaml
- runFlow: ../../subflows/open-expenses.yaml

# Empty state on a fresh group
- assertVisible: "No expenses yet"

# Create an equal-split expense with a manually selected category
- tapOn:
    id: "expense-add-button"
- extendedWaitUntil:
    visible:
      id: "expense-form-amount"
    timeout: 15000
# The amount has the focus, and Next moves on to the description
- inputText: "25.00"
- pressKey: Enter
- inputText: "Team snacks"
- pressKey: Enter
- tapOn:
    id: "expense-form-category"
- waitForAnimationToEnd
- takeScreenshot: e2e/results/creation-category-sheet
- extendedWaitUntil:
    visible:
      id: "picker-item-restaurant"
    timeout: 20000
- tapOn:
    id: "picker-item-restaurant"
- assertVisible: ".*25[.,]00.*"
- tapOn:
    id: "expense-form-submit"

# Back on the list: the new expense is visible
- extendedWaitUntil:
    visible: "Team snacks"
    timeout: 20000
- assertVisible: ".*25[.,]00.*"

# A CHF expense converted to EUR by hand, so the test never depends on the fetched rate
- tapOn:
    id: "expense-add-button"
- extendedWaitUntil:
    visible:
      id: "expense-form-amount"
    timeout: 15000
# Description first: on Android, after the currency sheet closes, the first tap from one text field to another is dropped
- tapOn:
    id: "expense-form-description"
- inputText: "Zurich dinner"
- pressKey: Enter
- tapOn:
    id: "expense-form-currency"
- extendedWaitUntil:
    visible:
      id: "picker-item-CHF"
    timeout: 20000
- tapOn:
    id: "picker-item-CHF"
- tapOn:
    id: "expense-form-amount"
- inputText: "10.00"
- tapOn:
    id: "expense-form-convert"
- extendedWaitUntil:
    visible:
      id: "expense-form-converted-amount"
    timeout: 10000
- tapOn:
    id: "expense-form-converted-amount"
- eraseText
- inputText: "9.00"
- tapOn:
    id: "expense-form-submit"
- extendedWaitUntil:
    visible: "Zurich dinner"
    timeout: 20000
- assertVisible: "€9[.,]00"
- assertVisible: ".*CHF.10[.,]00.*"

# The statistics count this month's expenses, and a category opens them in the list
- runFlow:
    file: ../../subflows/tap-tab.yaml
    env:
      TAB_ID: "tab-home"
      TAB_LABEL: "Home"
      TAB_X: "10%"
      MARKER_ID: "home-statistics"
# From the first expense on, the expenses card shows its number again
- extendedWaitUntil:
    visible: ".*€[0-9].*"
    timeout: 15000
- assertNotVisible: ".*Nothing spent yet.*"
- runFlow:
    file: ../../subflows/tap-until.yaml
    env:
      TARGET_ID: "home-statistics"
      MARKER_ID: "statistics-share"
# Last month's bar picks that month, this month's bar picks it again
- copyTextFrom:
    id: "statistics-range"
- evalScript: ${output.thisMonth = maestro.copiedText}
- scrollUntilVisible:
    element:
      id: "statistics-spending-.*"
    direction: DOWN
- tapOn:
    id: "statistics-spending-.*"
    index: 4
- scrollUntilVisible:
    element:
      id: "statistics-range"
    direction: UP
- assertNotVisible:
    id: "statistics-range"
    text: ${output.thisMonth}
- scrollUntilVisible:
    element:
      id: "statistics-spending-.*"
    direction: DOWN
- tapOn:
    id: "statistics-spending-.*"
    index: 5
- scrollUntilVisible:
    element:
      id: "statistics-range"
    direction: UP
- assertVisible:
    id: "statistics-range"
    text: ${output.thisMonth}
- scrollUntilVisible:
    element:
      id: "statistics-category-food-drinks"
    direction: DOWN
- runFlow:
    file: ../../subflows/tap-until.yaml
    env:
      TARGET_ID: "statistics-category-food-drinks"
      MARKER_ID: "expense-heading"
- extendedWaitUntil:
    visible: "Team snacks"
    timeout: 20000
- assertVisible:
    id: "expense-filter-category-clear"

# The photo picker is system UI; the web e2e covers the scan itself (same hook)
- tapOn:
    id: "expense-add-button"
- extendedWaitUntil:
    visible:
      id: "receipt-scan"
    timeout: 15000
- tapOn:
    id: "receipt-scan"
- extendedWaitUntil:
    visible:
      id: "receipt-scan-library"
    timeout: 10000
- assertVisible:
    id: "receipt-scan-camera"
- assertVisible:
    id: "receipt-scan-pdf"
