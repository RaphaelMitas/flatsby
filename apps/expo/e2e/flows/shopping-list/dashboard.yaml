appId: ${APP_ID}
tags:
  - shopping-list
---
# Mirrors apps/nextjs/e2e/shopping-list/shopping-list-dashboard.spec.ts:
# a group without lists starts on the first-list page, then lists switch from
# the title.
- runFlow: ../../subflows/e2e-login.yaml

- runFlow:
    file: ../../subflows/create-shopping-list.yaml
    env:
      LIST_NAME: "Groceries List"
- assertVisible:
    id: "shopping-list-title"
- assertVisible: "Groceries List"

# A second list from the switcher opens once it exists
- tapOn:
    id: "shopping-list-title"
- tapOn:
    id: "list-switcher-new"
- extendedWaitUntil:
    visible:
      id: "shopping-list-create-input"
    timeout: 15000
- tapOn:
    id: "shopping-list-create-input"
- inputText: "Second List"
- tapOn:
    id: "shopping-list-create-submit"
- extendedWaitUntil:
    visible: "Second List"
    timeout: 15000

# Switch back from the sheet
- tapOn:
    id: "shopping-list-title"
- extendedWaitUntil:
    visible:
      id: "list-switcher"
    timeout: 15000
- tapOn: "Groceries List"
- extendedWaitUntil:
    notVisible:
      id: "list-switcher"
    timeout: 15000
- assertVisible: "Groceries List"
- assertNotVisible: "Second List"
