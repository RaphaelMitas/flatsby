appId: com.flatcove.app.v2
env:
  GROUP_NAME: ${'E2E Group ' + Date.now()}
  LIST_NAME: ${'E2E List ' + Date.now()}
---
# Test: Shopping list management - create and verify list appears
# Matches Next.js shopping-list-management.spec.ts
- runFlow: ../../subflows/launch-fresh.yaml
- runFlow: ../../subflows/e2e-login.yaml
- extendedWaitUntil:
    visible:
      id: "groups-create-group-button"
- tapOn:
    id: "groups-create-group-button"
- extendedWaitUntil:
    visible:
      id: "create-group-name-input"
- runFlow:
    file: ../../subflows/fill-input.yaml
    env:
      INPUT_ID: create-group-name-input
      TEXT: ${GROUP_NAME}
- tapOn:
    id: "create-group-submit-button"
- extendedWaitUntil:
    visible:
      text: "${GROUP_NAME}"

# Select the group
- tapOn:
    text: "Select Group"
    rightOf:
      text: "${GROUP_NAME}"
- extendedWaitUntil:
    visible:
      id: "shopping-lists-create-button"

# Create a shopping list
- tapOn:
    id: "shopping-lists-create-button"
- extendedWaitUntil:
    visible:
      id: "create-shopping-list-name-input"
- runFlow:
    file: ../../subflows/fill-input.yaml
    env:
      INPUT_ID: create-shopping-list-name-input
      TEXT: ${LIST_NAME}
- tapOn:
    id: "create-shopping-list-submit-button"
- extendedWaitUntil:
    visible:
      text: "${LIST_NAME}, 0 items left"
    timeout: 30000
- assertVisible:
    text: "${LIST_NAME}, 0 items left"
