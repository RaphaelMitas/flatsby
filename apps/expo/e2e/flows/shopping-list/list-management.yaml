appId: com.flatcove.app.v2
env:
  GROUP_NAME: "E2E Group ${timestamp}"
  LIST_NAME: "E2E List ${timestamp}"
---
# Test: Shopping list management - create and verify list appears
# Matches Next.js shopping-list-management.spec.ts
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
        id: "login-screen"
- tapOn:
    id: "sign-in-e2e-button"
- extendedWaitUntil:
    visible:
        text: "Your Groups"
- extendedWaitUntil:
    visible:
        id: "groups-create-group-button"
- tapOn:
    id: "groups-create-group-button"
- extendedWaitUntil:
    visible:
        id: "create-group-name-input"
- inputText:
    id: "create-group-name-input"
    text: "${GROUP_NAME}"
- tapOn:
    id: "create-group-submit-button"
- extendedWaitUntil:
    visible:
        text: "${GROUP_NAME}"

# Select the group
- tapOn:
    text: "Select Group"
- extendedWaitUntil:
    visible:
        id: "shopping-lists-create-button"

# Create a shopping list
- tapOn:
    id: "shopping-lists-create-button"
- extendedWaitUntil:
    visible:
        id: "create-shopping-list-name-input"
- inputText:
    id: "create-shopping-list-name-input"
    text: "${LIST_NAME}"
- tapOn:
    id: "create-shopping-list-submit-button"
- extendedWaitUntil:
    visible:
        text: "${LIST_NAME}"
- assertVisible:
    text: "${LIST_NAME}"
