appId: ${APP_ID}
tags:
  - shopping-list
---
# Mirrors apps/nextjs/e2e/shopping-list/shopping-list-items.spec.ts:
# add with manual category, complete, undo completion, edit, delete.
# Edit and delete run twice: by swipe, then from the item details.
- runFlow: ../../subflows/e2e-login.yaml
- runFlow:
    file: ../../subflows/create-shopping-list.yaml
    env:
      LIST_NAME: "Items List"

# Add item with a manual category
- tapOn:
    id: "shopping-list-item-input"
- inputText: "Apples"
- tapOn:
    id: "shopping-list-category-picker"
- waitForAnimationToEnd
- takeScreenshot: e2e/results/items-category-sheet
- extendedWaitUntil:
    visible:
      id: "picker-item-produce"
    timeout: 20000
- tapOn:
    id: "picker-item-produce"
- tapOn:
    id: "shopping-list-add-item-button"
- extendedWaitUntil:
    visible:
      id: "shopping-list-item-checkbox-Apples"
    timeout: 15000
- assertVisible: "Produce"

# Complete the item -> moves to Purchased Items
- tapOn:
    id: "shopping-list-item-checkbox-Apples"
- extendedWaitUntil:
    visible: "Purchased Items"
    timeout: 15000

# Undo completion -> Purchased section disappears
- tapOn:
    id: "shopping-list-item-checkbox-Apples"
- extendedWaitUntil:
    notVisible: "Purchased Items"
    timeout: 15000

# Edit: swipe right on the item to open the edit screen
- swipe:
    from:
      text: "Apples"
    direction: RIGHT
- extendedWaitUntil:
    visible:
      id: "shopping-list-item-edit-input"
    timeout: 15000
- tapOn:
    id: "shopping-list-item-edit-input"
- eraseText
- inputText: "Green Apples"
- tapOn:
    id: "shopping-list-item-edit-save"
- extendedWaitUntil:
    visible: "Green Apples"
    timeout: 15000
- assertNotVisible: "Apples"

# Delete: swipe left on the item, confirm in the dialog
- swipe:
    from:
      text: "Green Apples"
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: "delete-confirmation-confirm"
    timeout: 15000
- tapOn:
    id: "delete-confirmation-confirm"
- extendedWaitUntil:
    notVisible: "Green Apples"
    timeout: 15000

# The same two actions without a swipe: a tap on the item opens its details
- runFlow:
    file: ../../subflows/add-shopping-list-item.yaml
    env:
      ITEM_NAME: "Oat Milk"
      CATEGORY: "dairy"
- extendedWaitUntil:
    visible:
      id: "shopping-list-item-checkbox-Oat Milk"
    timeout: 15000
- runFlow:
    file: ../../subflows/tap-until.yaml
    env:
      TARGET_ID: "shopping-list-item-Oat Milk"
      MARKER_ID: "shopping-list-item-details-edit"
- tapOn:
    id: "shopping-list-item-details-edit"
- extendedWaitUntil:
    visible:
      id: "shopping-list-item-edit-input"
    timeout: 15000
- tapOn:
    id: "shopping-list-item-edit-input"
- eraseText
- inputText: "Soy Milk"
- tapOn:
    id: "shopping-list-item-edit-save"
- extendedWaitUntil:
    visible: "Soy Milk"
    timeout: 15000
- runFlow:
    file: ../../subflows/tap-until.yaml
    env:
      TARGET_ID: "shopping-list-item-Soy Milk"
      MARKER_ID: "shopping-list-item-details-delete"
- tapOn:
    id: "shopping-list-item-details-delete"
- extendedWaitUntil:
    visible:
      id: "delete-confirmation-confirm"
    timeout: 15000
- tapOn:
    id: "delete-confirmation-confirm"
- extendedWaitUntil:
    notVisible: "Soy Milk"
    timeout: 15000
