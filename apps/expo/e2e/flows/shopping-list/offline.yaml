appId: ${APP_ID}
tags:
  - shopping-list
---
# Tick an item and add and tick another in airplane mode, restart while still
# offline, then reconnect and check the server got both ticks. Android only:
# the iOS simulator has no airplane mode. The API comes in over adb reverse,
# which airplane mode leaves up, so this tests what the app does with the
# offline signal, not a dropped connection.
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow: ../../subflows/e2e-login.yaml
      - runFlow:
          file: ../../subflows/create-shopping-list.yaml
          env:
            LIST_NAME: "Offline List"
      - tapOn:
          id: "shopping-list-item-input"
      - inputText: "Apples"
      - tapOn:
          id: "shopping-list-category-picker"
      - extendedWaitUntil:
          visible:
            id: "picker-item-produce"
          timeout: 20000
      - tapOn:
          id: "picker-item-produce"
      - tapOn:
          id: "shopping-list-add-item-button"
      - extendedWaitUntil:
          visible:
            id: "shopping-list-item-checkbox-Apples"
          timeout: 15000
      - waitForAnimationToEnd

      - setAirplaneMode: enabled
      - extendedWaitUntil:
          visible: "Offline"
          timeout: 20000

      - tapOn:
          id: "shopping-list-item-checkbox-Apples"
      - extendedWaitUntil:
          visible:
            id: "shopping-list-item-Apples-unsynced"
          timeout: 10000

      # Added offline, so it only has a temporary id until the queue replays
      - tapOn:
          id: "shopping-list-item-input"
      - inputText: "Bread"
      - tapOn:
          id: "shopping-list-category-picker"
      - extendedWaitUntil:
          visible:
            id: "picker-item-produce"
          timeout: 20000
      - tapOn:
          id: "picker-item-produce"
      - tapOn:
          id: "shopping-list-add-item-button"
      - tapOn:
          id: "shopping-list-item-checkbox-Bread"
      - extendedWaitUntil:
          visible:
            id: "shopping-list-item-Bread-unsynced"
          timeout: 10000
      - extendedWaitUntil:
          visible: "Offline · 3 changes sync later"
          timeout: 10000

      - swipe:
          from:
            id: "sync-pill"
          direction: UP
      - extendedWaitUntil:
          notVisible:
            id: "sync-pill"
          timeout: 10000

      # The queue and the ticks have to survive a restart
      - runFlow:
          file: ../../subflows/relaunch.yaml
          env:
            MARKER_ID: "shopping-list-dashboard-link"
      - tapOn:
          id: "shopping-list-dashboard-link"
      - extendedWaitUntil:
          visible:
            id: "shopping-list-item-Bread-unsynced"
          timeout: 15000
      - assertVisible:
          id: "shopping-list-item-Apples-unsynced"

      - setAirplaneMode: disabled
      - extendedWaitUntil:
          notVisible:
            id: "shopping-list-item-Bread-unsynced"
          timeout: 60000
      # Only rows the server returned as done sit under Purchased Items
      - extendedWaitUntil:
          visible: "Purchased Items"
          timeout: 30000
      - assertVisible:
          id: "shopping-list-item-checkbox-Bread"
          checked: true
      - assertVisible:
          id: "shopping-list-item-checkbox-Apples"
          checked: true
