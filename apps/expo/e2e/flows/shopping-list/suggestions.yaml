appId: ${APP_ID}
tags:
  - shopping-list
---
# Mirrors apps/nextjs/e2e/shopping-list/shopping-list-suggestions.spec.ts:
# previously added items are suggested while typing; tapping one fills the input.
- runFlow: ../../subflows/e2e-login.yaml
- runFlow:
    file: ../../subflows/create-shopping-list.yaml
    env:
      LIST_NAME: "Suggest List"

# Add "Milk" with the dairy category and wait for the server commit
- tapOn:
    id: "shopping-list-item-input"
- inputText: "Milk"
# The add form is translated above the keyboard, and Android reports the
# untranslated bounds, so a tap by id lands where the control used to be.
# Dismissing first collapses the translation; the suggestions stay on screen
# because they follow the typed text, not the keyboard. iOS reports the real
# bounds and its hideKeyboard is flaky, so keep this off that platform.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "shopping-list-category-picker"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "picker-item-dairy"
    timeout: 20000
- tapOn:
    id: "picker-item-dairy"
- tapOn:
    id: "shopping-list-add-item-button"
- extendedWaitUntil:
    visible: "Milk"
    timeout: 15000

# Type a prefix -> the suggestion badge appears
- tapOn:
    id: "shopping-list-item-input"
- inputText: "Mil"
- extendedWaitUntil:
    visible:
      id: "shopping-list-suggestion"
    timeout: 20000

# Tapping the suggestion fills the input
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "shopping-list-suggestion"
- assertVisible:
    id: "shopping-list-item-input"
    text: "Milk"
