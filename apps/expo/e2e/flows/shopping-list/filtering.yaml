appId: ${APP_ID}
tags:
  - shopping-list
---
# Mirrors "Category Filtering" from
# apps/nextjs/e2e/shopping-list/shopping-list-management.spec.ts.
- runFlow: ../../subflows/e2e-login.yaml
- runFlow:
    file: ../../subflows/create-shopping-list.yaml
    env:
      LIST_NAME: "Filter List"

# Add a produce item
- tapOn:
    id: "shopping-list-item-input"
- inputText: "Carrots"
# The add form is translated above the keyboard, and Android reports the
# untranslated bounds, so a tap by id lands where the control used to be.
# Dismissing first collapses the translation; the suggestions stay on screen
# because they follow the typed text, not the keyboard.
- hideKeyboard
- tapOn:
    id: "shopping-list-category-picker"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "picker-item-produce"
    timeout: 20000
- tapOn:
    id: "picker-item-produce"
- tapOn:
    id: "shopping-list-add-item-button"
- extendedWaitUntil:
    visible: "Carrots"
    timeout: 15000

# Add a dairy item
- tapOn:
    id: "shopping-list-item-input"
- inputText: "Cheese"
- hideKeyboard
- tapOn:
    id: "shopping-list-category-picker"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "picker-item-dairy"
    timeout: 20000
- tapOn:
    id: "picker-item-dairy"
- tapOn:
    id: "shopping-list-add-item-button"
- extendedWaitUntil:
    visible: "Cheese"
    timeout: 15000

# Filter by produce: only the produce item stays visible
- tapOn:
    id: "category-filter-produce"
- extendedWaitUntil:
    notVisible: "Cheese"
    timeout: 15000
- assertVisible: "Carrots"

# Back to all
- tapOn:
    id: "category-filter-all"
- extendedWaitUntil:
    visible: "Cheese"
    timeout: 15000
- assertVisible: "Carrots"
