appId: ${APP_ID}
tags:
  - shopping-list
---
# Mirrors apps/nextjs/e2e/shopping-list/shopping-list-management.spec.ts:
# rename a list from the dashboard, then delete a list (with typed
# confirmation). Like the web spec, deletion targets a freshly created list.
- runFlow: ../../subflows/e2e-login.yaml

# Select group, create a list, but stay on the lists dashboard
- tapOn:
    id: "group-select-button"
- extendedWaitUntil:
    visible:
      id: "shopping-list-create-button"
    timeout: 15000
- tapOn:
    id: "shopping-list-create-button"
- extendedWaitUntil:
    visible:
      id: "shopping-list-create-input"
    timeout: 15000
- tapOn:
    id: "shopping-list-create-input"
- inputText: "Rename Me"
- tapOn:
    id: "shopping-list-create-submit"
- extendedWaitUntil:
    visible: "Rename Me"
    timeout: 15000

# Rename: swipe right on the list row to reveal the inline rename form
- swipe:
    from:
      text: "Rename Me"
    direction: RIGHT
- extendedWaitUntil:
    visible:
      id: "shopping-list-rename-input"
    timeout: 15000
# Taps and text input sometimes don't register on hosted runners; retry the
# whole fill-and-save so a dropped inputText can recover too, not just a
# dropped save tap. The conditionals skip steps once the form has closed.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: "shopping-list-rename-input"
          commands:
            - tapOn:
                id: "shopping-list-rename-input"
            - eraseText
            - inputText: "Renamed List"
      - runFlow:
          when:
            visible:
              id: "shopping-list-rename-save"
          commands:
            - tapOn:
                id: "shopping-list-rename-save"
      - extendedWaitUntil:
          visible: "Renamed List"
          timeout: 15000

# Create a second list to exercise deletion
- tapOn:
    id: "shopping-list-create-button"
- extendedWaitUntil:
    visible:
      id: "shopping-list-create-input"
    timeout: 15000
- tapOn:
    id: "shopping-list-create-input"
- inputText: "Doomed List"
- tapOn:
    id: "shopping-list-create-submit"
- extendedWaitUntil:
    visible: "Doomed List"
    timeout: 15000

# Delete: swipe left on the list row, type the name in the dialog, confirm
- swipe:
    from:
      text: "Doomed List"
    direction: LEFT
- runFlow:
    file: ../../subflows/confirm-delete.yaml
    env:
      CONFIRM_TEXT: "Doomed List"

# Only the deleted list is gone
- extendedWaitUntil:
    notVisible: "Doomed List"
    timeout: 15000
- assertVisible: "Renamed List"
