appId: ${APP_ID}
tags:
  - shopping-list
---
# Mirrors apps/nextjs/e2e/shopping-list/shopping-list-management.spec.ts:
# rename a list from the switcher, then delete the open list (with typed
# confirmation). Like the web spec, deletion targets a freshly created list.
- runFlow: ../../subflows/e2e-login.yaml

- runFlow:
    file: ../../subflows/create-shopping-list.yaml
    env:
      LIST_NAME: "Rename Me"

# Rename through the row's ⋯ in the switcher
- tapOn:
    id: "shopping-list-title"
- tapOn: "More for Rename Me"
- extendedWaitUntil:
    visible:
      id: "shopping-list-rename-input"
    timeout: 15000
# Taps and text input sometimes don't register on hosted runners; retry the
# whole fill-and-save so a dropped inputText can recover too, not just a
# dropped save tap. The conditionals skip steps once the form has closed.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: "shopping-list-rename-input"
          commands:
            - tapOn:
                id: "shopping-list-rename-input"
            - eraseText
            - inputText: "Renamed List"
      - runFlow:
          when:
            visible:
              id: "shopping-list-rename-save"
          commands:
            - tapOn:
                id: "shopping-list-rename-save"
      - extendedWaitUntil:
          visible: "Renamed List"
          timeout: 15000

# Create a second list to exercise deletion; it opens once created
- tapOn:
    id: "shopping-list-title"
- tapOn:
    id: "list-switcher-new"
- extendedWaitUntil:
    visible:
      id: "shopping-list-create-input"
    timeout: 15000
- tapOn:
    id: "shopping-list-create-input"
- inputText: "Doomed List"
- tapOn:
    id: "shopping-list-create-submit"
- extendedWaitUntil:
    visible: "Doomed List"
    timeout: 15000

# Delete the open list, type the name in the dialog, confirm
- tapOn:
    id: "shopping-list-title"
- tapOn: "More for Doomed List"
- extendedWaitUntil:
    visible:
      id: "shopping-list-delete"
    timeout: 15000
- tapOn:
    id: "shopping-list-delete"
- runFlow:
    file: ../../subflows/confirm-delete.yaml
    env:
      CONFIRM_TEXT: "Doomed List"

# Only the deleted list is gone, and the tab falls back to the other one
- extendedWaitUntil:
    notVisible: "Doomed List"
    timeout: 15000
- assertVisible: "Renamed List"
