appId: ${APP_ID}
tags:
  - account
---
# The consent switch in settings opens the consent sheet.
- runFlow: ../../subflows/e2e-login.yaml
- tapOn: "Settings"
- runFlow:
    file: ../../subflows/open-link.yaml
    env:
      LINK: flatsby://settings/analytics
      MARKER_ID: "analytics-usage"

- tapOn:
    id: "analytics-screens"
- extendedWaitUntil:
    visible:
      id: "analytics-sheet-done"
    timeout: 15000
- tapOn:
    id: "analytics-sheet-done"
- extendedWaitUntil:
    notVisible:
      id: "analytics-sheet-done"
    timeout: 15000
- assertVisible:
    id: "analytics-usage"
