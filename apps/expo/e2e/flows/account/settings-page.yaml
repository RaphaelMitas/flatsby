appId: com.flatcove.app.v2
env:
  GROUP_NAME: ${'E2E Group ' + Date.now()}
---
# Test: Navigate to settings and verify key elements exist
# Matches Next.js account-management.spec.ts structure
- runFlow: ../../subflows/launch-fresh.yaml
- runFlow: ../../subflows/e2e-login.yaml
- extendedWaitUntil:
    visible:
      id: "groups-create-group-button"
- tapOn:
    id: "groups-create-group-button"
- extendedWaitUntil:
    visible:
      id: "create-group-name-input"
- runFlow:
    file: ../../subflows/fill-input.yaml
    env:
      INPUT_ID: create-group-name-input
      TEXT: ${GROUP_NAME}
- tapOn:
    id: "create-group-submit-button"
- extendedWaitUntil:
    visible:
      text: "${GROUP_NAME}"

# Navigate to settings tab
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      id: "settings-delete-account"
- assertVisible:
    id: "settings-delete-account"
- assertVisible:
    id: "settings-logout"
- assertVisible:
    id: "settings-group-settings"
