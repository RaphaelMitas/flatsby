appId: ${APP_ID}
---
# Smoke test: app launches and shows the full login screen (no auth state).
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "login-screen"
    timeout: 60000
- assertVisible:
    id: "sign-in-google-button"
- assertVisible:
    id: "sign-in-apple-button"
- assertVisible:
    text: "Manage your daily life with your flatmates."
