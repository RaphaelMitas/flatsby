appId: ${APP_ID}
---
# Relaunch, keeping state. Retried: on iOS Maestro sometimes reports a slow
# cold start as a crash.
#
# env: MARKER_ID (element the relaunched screen shows)
- retry:
    maxRetries: 2
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: ${MARKER_ID}
          timeout: 60000
