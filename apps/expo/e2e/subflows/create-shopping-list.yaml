appId: ${APP_ID}
---
# Shared subflow: from the authenticated group dashboard, selects the fixture
# group, opens the Shopping tab and creates the group's first list, ${LIST_NAME}.
- tapOn:
    id: "group-select-button"
- extendedWaitUntil:
    visible:
      id: "dashboard-group-picker"
    timeout: 15000
- runFlow:
    file: tap-tab.yaml
    env:
      TAB_ID: "tab-shopping-list"
      TAB_LABEL: "Shopping"
      TAB_X: "30%"
      MARKER_ID: "first-list-title"
- tapOn:
    id: "first-list-input"
- inputText: ${LIST_NAME}
# Tap a neutral text to dismiss the keyboard (hideKeyboard fails on iOS)
- tapOn:
    id: "first-list-title"
- tapOn:
    id: "first-list-create"
- extendedWaitUntil:
    visible:
      id: "shopping-list-item-input"
    timeout: 15000
