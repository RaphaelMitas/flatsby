appId: ${APP_ID}
---
# Shared subflow: from the group dashboard, creates a group named
# ${GROUP_NAME} and waits for it to appear.
- tapOn:
    id: "group-create-button"
- extendedWaitUntil:
    visible:
      id: "group-create-name-input"
    timeout: 15000
- tapOn:
    id: "group-create-name-input"
- inputText: ${GROUP_NAME}
- tapOn:
    id: "group-create-submit"
- extendedWaitUntil:
    visible: ${GROUP_NAME}
    timeout: 15000
