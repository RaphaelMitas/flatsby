appId: ${APP_ID}
---
# Shared subflow: from the group dashboard, creates a group named
# ${GROUP_NAME}, skips the invite step and waits for the group's home.
- tapOn:
    id: "group-create-button"
- extendedWaitUntil:
    visible:
      id: "group-create-name-input"
    timeout: 15000
- tapOn:
    id: "group-create-name-input"
- inputText: ${GROUP_NAME}
- tapOn:
    id: "group-create-submit"
- extendedWaitUntil:
    visible:
      id: "group-invite-code"
    timeout: 15000
# Done sits below the placeholder names, off screen on small devices
- scrollUntilVisible:
    element:
      id: "group-invite-done"
    direction: DOWN
- tapOn:
    id: "group-invite-done"
# Home shows the name in the group picker button, which iOS reads as one label
# together with its icon glyph, so match it as a substring
- extendedWaitUntil:
    visible: ".*${GROUP_NAME}.*"
    timeout: 15000
