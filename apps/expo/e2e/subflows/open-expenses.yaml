appId: ${APP_ID}
---
# Shared subflow: from the authenticated group dashboard, selects the fixture
# group and switches to the Expenses tab.
- tapOn:
    id: "group-select-button"
- extendedWaitUntil:
    visible:
      id: "dashboard-group-picker"
    timeout: 15000
- runFlow:
    file: tap-tab.yaml
    env:
      TAB_ID: "tab-expenses"
      TAB_LABEL: "Expenses"
      TAB_X: "39%"
      MARKER_ID: "expense-heading"
