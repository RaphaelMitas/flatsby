appId: ${APP_ID}
---
# Shared subflow: from the authenticated group dashboard, selects the fixture
# group and switches to the Expenses tab.
- tapOn:
    id: "group-select-button"
- extendedWaitUntil:
    visible:
      id: "shopping-list-create-button"
    timeout: 15000
- runFlow:
    file: tap-tab.yaml
    env:
      TAB_ID: "tab-expenses"
      TAB_LABEL: "Expenses"
      TAB_X: "62%"
- extendedWaitUntil:
    visible:
      id: "expense-heading"
    timeout: 15000
