appId: ${APP_ID}
---
# Shared subflow: creates an isolated e2e user + session and relaunches the
# app authenticated. Mirrors the web suite's fixtures/auth.ts.
#
# Requires env vars (passed via `maestro test -e`):
#   E2E_API_URL            - the deployment to test against
#   VERCEL_BYPASS_SECRET   - Vercel protection bypass secret (optional)
# A failed flow can leave the "Open in Flatsby?" confirmation on the
# springboard, which blocks launchApp for every flow after it. (iOS only:
# Android opens scheme links directly, so the conditionals never fire there.)
- runFlow:
    when:
      visible: "Open in .*Flatsby.*"
    commands:
      - tapOn: "Cancel"
# clearState alone leaves the iOS Keychain intact, where expo-secure-store
# keeps the previous flow's session — clear it so every flow starts logged out.
# The post-clearState relaunch can stall for minutes on a black screen before
# the first frame; maxRetries is at Maestro's cap of 3.
- retry:
    maxRetries: 3
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
      # 60s, not less: with 30s caps, runs 31252993233 and 31253444377
      # exhausted every launch attempt — a cold post-clearState boot on a CI
      # simulator regularly needs more than 30s to first frame.
      - extendedWaitUntil:
          visible:
            id: "login-screen"
          timeout: 60000
# Optional E2E_USER_NAME / E2E_USER_EMAIL override the minted identity (the
# store-screenshot flow wants a presentable admin).
- evalScript: "${output.e2eLoginLink = 'flatsby://e2e-login?apiUrl=' + encodeURIComponent(E2E_API_URL) + '&bypass=' + encodeURIComponent(typeof VERCEL_BYPASS_SECRET !== 'undefined' ? VERCEL_BYPASS_SECRET : '') + (typeof E2E_USER_NAME !== 'undefined' ? '&name=' + encodeURIComponent(E2E_USER_NAME) : '') + (typeof E2E_USER_EMAIL !== 'undefined' ? '&email=' + encodeURIComponent(E2E_USER_EMAIL) : '') + (typeof E2E_SEED !== 'undefined' ? '&seed=' + encodeURIComponent(E2E_SEED) : '')}"
# openLink sits inside the retry: if session setup errors out, the e2e-login
# screen parks in its error state (run 31255356976, iPad), and only re-firing
# the link restarts it — re-waiting alone never recovers. iOS also sometimes
# confirms scheme links a beat after openLink returns, hence the guarded tap.
- retry:
    maxRetries: 2
    commands:
      - openLink: ${output.e2eLoginLink}
      - runFlow:
          when:
            visible: "Open in .*Flatsby.*"
          commands:
            - tapOn: "Open"
      - extendedWaitUntil:
          visible:
            id: "e2e-login-done"
          timeout: 45000
# Relaunch (keeping state) so the auth client and tRPC links initialize with
# the injected session + API URL override.
- launchApp
- extendedWaitUntil:
    visible:
      id: "group-dashboard-title"
    timeout: 60000
