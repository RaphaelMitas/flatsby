appId: ${APP_ID}
---
# Switch to a bottom tab and wait for MARKER_ID to prove it showed. Each retry
# escalates: label text, which is what nearly every green CI run tapped; then
# the trigger testID on iOS, which the SwiftUI tab bar exposes only sometimes
# (run 31252036515 failed on "Id matching regex: tab-home"; run 31252348033
# resolved the same id fine) and Android never; then the tab's slot position,
# which at 95% height misses the iOS 26 floating tab bar (run 31254443153).
#
# Attempts are counted rather than probed with `when: visible`, because a
# false visibility check waits out Maestro's 7s lookup window, and right after
# launchApp that window can shrink to nothing and skip every branch.
#
# env: TAB_ID (e.g. tab-home), TAB_LABEL (e.g. Home), TAB_X (slot center as
# an integer percent, e.g. "12%"), MARKER_ID (element only that tab shows)
- evalScript: ${output.tabAttempt = 0}
- retry:
    maxRetries: 2
    commands:
      - evalScript: ${output.tabAttempt = output.tabAttempt + 1}
      - runFlow:
          when:
            true: ${output.tabAttempt == 1}
          commands:
            - tapOn: ${TAB_LABEL}
      - runFlow:
          when:
            platform: iOS
            true: ${output.tabAttempt == 2}
          commands:
            - tapOn:
                id: ${TAB_ID}
      - runFlow:
          when:
            platform: Android
            true: ${output.tabAttempt == 2}
          commands:
            - tapOn: ${TAB_LABEL}
      - runFlow:
          when:
            true: ${output.tabAttempt == 3}
          commands:
            - tapOn:
                point: "${TAB_X}, 95%"
      - extendedWaitUntil:
          visible:
            id: ${MARKER_ID}
          timeout: 15000
