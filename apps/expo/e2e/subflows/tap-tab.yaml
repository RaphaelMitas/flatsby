appId: ${APP_ID}
---
# Switch to a bottom tab and wait for MARKER_ID. Each attempt escalates:
# label text, what nearly every green CI run tapped; then the testID, which
# the SwiftUI tab bar exposes only sometimes (run 31252036515 vs 31252348033)
# and Android never, so Android retries the label; then the slot position,
# last because at 95% height it misses the iOS 26 floating bar (run 31254443153).
#
# Attempts are counted, not probed with `when: visible`: a false check waits
# out Maestro's 7s window, which right after launchApp can shrink to nothing.
#
# env: TAB_ID (e.g. tab-home), TAB_LABEL (e.g. Home), TAB_X (slot center as
# an integer percent, e.g. "12%"), MARKER_ID (element only that tab shows)
- evalScript: ${output.tabAttempt = 0}
- retry:
    maxRetries: 2
    commands:
      - evalScript: ${output.tabAttempt = output.tabAttempt + 1}
      - runFlow:
          when:
            true: ${output.tabAttempt == 1}
          commands:
            - tapOn: ${TAB_LABEL}
      - runFlow:
          when:
            platform: iOS
            true: ${output.tabAttempt == 2}
          commands:
            - tapOn:
                id: ${TAB_ID}
      - runFlow:
          when:
            platform: Android
            true: ${output.tabAttempt == 2}
          commands:
            - tapOn: ${TAB_LABEL}
      - runFlow:
          when:
            true: ${output.tabAttempt == 3}
          commands:
            - tapOn:
                point: "${TAB_X}, 95%"
      - extendedWaitUntil:
          visible:
            id: ${MARKER_ID}
          timeout: 20000
