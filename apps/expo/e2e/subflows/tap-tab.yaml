appId: ${APP_ID}
---
# Switch to a bottom tab. The native tab bar (expo-router NativeTabs) sets
# the trigger testID -> accessibilityIdentifier, but the SwiftUI tab bar
# exposes it to Maestro's hierarchy inconsistently (run 31252036515 failed on
# "Id matching regex: tab-home"; run 31252348033 resolved the same id fine).
# Positional taps alone are no safer: at 95% height they miss the iOS 26
# floating tab bar (run 31254443153). So: id, then label text — the approach
# every green run used — then the tab's slot position as a last resort. The
# caller's post-switch wait verifies the tab actually changed.
#
# env: TAB_ID (e.g. tab-home), TAB_LABEL (e.g. Home), TAB_X (slot center as
# an integer percent, e.g. "12%")
#
# The app hides the tab bar while the keyboard is open, so a flow that leaves
# an input focused has no tab bar to tap. Dismiss first; this is a no-op when
# no keyboard is up.
- hideKeyboard
- runFlow:
    when:
      visible:
        id: ${TAB_ID}
    commands:
      - tapOn:
          id: ${TAB_ID}
- runFlow:
    when:
      notVisible:
        id: ${TAB_ID}
    commands:
      - runFlow:
          when:
            visible: ${TAB_LABEL}
          commands:
            - tapOn: ${TAB_LABEL}
      - runFlow:
          when:
            notVisible: ${TAB_LABEL}
          commands:
            - tapOn:
                point: "${TAB_X}, 95%"
