plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.flatcove.receipttext'
version = '1.0.0'

android {
  namespace "com.flatcove.receipttext"
}

dependencies {
  // Play Services ships the model, so it doesn't add to the app's own size
  implementation "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
}
